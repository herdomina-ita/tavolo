  const L = pgLv(d), pb = pgPB(L), c = pgCls(d), sp = pgSpe(d), bg = pgBg(d);
  const sc = {}, md = {}; for (const a of PCARK) { sc[a] = pgScore(d, a); md[a] = pgMod(sc[a]); }
  // tiri salvezza
  const ts = new Set(c ? c.ts : []);
  if (c && d.classe === 'Ladro' && PG5 && L >= 15) ts.add('sag');
  if (c && d.classe === 'Monaco' && L >= 14) PCARK.forEach(a => ts.add(a));
  // abilità
  const fisse = {};
  if (bg) for (const k of bg.sk) if (k !== TUTTE) fisse[k] = 'background';
  if (sp) for (const k of (sp.sk || [])) if (typeof k === 'string' && k !== TUTTE) fisse[k] = PGD.nomeSpecie.toLowerCase();
  const scelteSk = [];  // [chiave, opzioni, origine]
  if (sp) (sp.sk || []).forEach((k, i) => { if (Array.isArray(k) || k === TUTTE) scelteSk.push(['r' + i, Array.isArray(k) && k[0] !== TUTTE ? k : PGD.abil.map(x => x[0]), PGD.nomeSpecie]); });
  if (bg) bg.sk.forEach((k, i) => { if (k === TUTTE) scelteSk.push(['b' + i, PGD.abil.map(x => x[0]), 'Background']); });
  for (const [k] of scelteSk) { const v = (d.skS || {})[k]; if (v) fisse[v] = fisse[v] || 'scelta'; }
  const fact = c && d.classe === 'Bardo' && L >= 2;
  const sk = PGD.abil.map(([n, a]) => {
    const prof = !!fisse[n] || !!(d.skC || {})[n], exp = prof && !!(d.exp || {})[n];
    const v = md[a] + (prof ? pb * (exp ? 2 : 1) : fact ? Math.floor(pb / 2) : 0);
    return {n, a, prof, exp, fissa: fisse[n] || '', v};
  });
  const skClasse = c ? Object.keys(d.skC || {}).filter(k => d.skC[k] && !fisse[k] && (c.sk[1] === TUTTE || c.sk[1].includes(k))).length : 0;
  // CA
  const ar = PGD.armature.find(x => x[0] === d.arm);
  let ca, caTxt;
  if (ar) { const dx = ar[3] == null ? md.des : Math.min(md.des, ar[3]); ca = ar[1] + dx; caTxt = ar[0]; }
  else {
    ca = 10 + md.des; caTxt = 'Senza armatura';
    const cad = c && c.cad;
    if (cad === 'cos') { ca = Math.max(ca, 10 + md.des + md.cos); caTxt = 'Difesa senza armatura'; }
    if (cad === 'sag' && !d.scudo) { ca = Math.max(ca, 10 + md.des + md.sag); caTxt = 'Difesa senza armatura'; }
    if (cad === 'draco' && L >= (PG5 ? 1 : 3)) { const v = PG5 ? 13 + md.des : 10 + md.des + md.car; if (v > ca) { ca = v; caTxt = 'Resilienza draconica'; } }
  }
  if (d.scudo) ca += 2;
  ca += Number(d.caMisc) || 0;
  const avvisi = [];
  if (ar && c) { const cat = ar[2]; if (!c.arm.includes(cat) && !(d.classe === 'Chierico' && PG5 && cat === 'p' && L >= 1)) avvisi.push(`Il ${d.classe.toLowerCase()} non ha competenza in questa armatura: svantaggio alle prove e ai tiri per colpire con Forza e Destrezza, niente incantesimi.`); }
  if (d.scudo && c && !c.scudo) avvisi.push('Questa classe non ha competenza negli scudi.');
  // velocità
  let vel = sp ? sp.vel : 9;
  if (!PG5 && d.specie === 'Elfo' && (d.scelte || {})['Lignaggio elfico'] === 'Elfo dei boschi') vel = 10.5;
  if (c && d.classe === 'Barbaro' && L >= 5 && !(ar && ar[2] === 'p')) vel += 3;
  if (c && d.classe === 'Monaco' && L >= 2 && !ar && !d.scudo) vel += [0, 0, 3, 3, 3, 3, 4.5, 4.5, 4.5, 4.5, 6, 6, 6, 6, 7.5, 7.5, 7.5, 7.5, 9, 9, 9][L];
  if (ar && ar[4] && sc.for < ar[4] && !(PG5 && d.specie.startsWith('Nano'))) { vel -= 3; avvisi.push(`Forza inferiore a ${ar[4]}: velocità ridotta di 3 metri con questa armatura.`); }
  // punti ferita
  let pf = 0;
  if (c) { pf = c.dv + md.cos + (L - 1) * (c.dv / 2 + 1 + md.cos); }
  if (sp && sp.pfLv) pf += L;
  if (c && c.cad === 'draco' && L >= (PG5 ? 1 : 3)) pf += L;
  pf += Number(d.pfAgg) || 0;
  pf = Math.max(pf, L);
  // iniziativa
  let ini = md.des;
  if (!PG5 && (d.tal || []).includes('Allerta')) ini += pb;
  if (PG5 && fact) ini += Math.floor(pb / 2);
  // incantesimi
  let mag = null;
  if (c && c.cast) {
    const k = c.cast, m = md[k.car];
    let slot = [], patto = null;
    if (k.t === 'full') slot = PGD.slot[L] || [];
    else if (k.t === 'half') slot = PGD.slot[Math.ceil(L / 2)] || [];
    else if (k.t === 'half5') slot = L >= 2 ? PGD.slot[Math.ceil(L / 2)] : [];
    else if (k.t === 'pact') patto = PGD.patto[L];
    const cant = k.cant ? k.cant[L - 1] : 0;
    let prep = null, prepTxt = 'Incantesimi preparati';
    if (k.prep) prep = k.prep[L - 1];
    else if (k.known) { prep = k.known[L - 1]; prepTxt = 'Incantesimi conosciuti'; }
    else if (k.prepF === 'lv') prep = Math.max(1, m + L);
    else if (k.prepF === 'lv2') prep = Math.max(1, m + Math.floor(L / 2));
    const maxLv = patto ? patto[1] : slot.length;
    mag = {car: k.car, cd: 8 + pb + m, att: pb + m, slot, patto, cant, prep, prepTxt, maxLv};
  }
  return {L, pb, sc, md, ts, sk, skClasse, ca, caTxt, vel, pf, ini, mag, avvisi, perc: 10 + sk.find(x => x.n === 'Percezione').v, c, sp, bg};
}
function pgWeaponProf(d, w){
  const c = pgCls(d); if (!c) return false;
  const sp = pgSpe(d), cat = w[3][0], props = w[4].toLowerCase();
  const l = [...(c.armiP || []), ...((sp && sp.armiP) || [])];
  if (l.includes(w[0])) return true;
  if (cat === 's' && l.includes('s')) return true;
  if (cat === 'g' && l.includes('g')) return true;
  if (cat === 'g' && l.includes('gal') && (props.includes('accurata') || props.includes('leggera'))) return true;
  if (cat === 'g' && l.includes('gl') && props.includes('leggera')) return true;
  return false;
}
function pgAttack(d, R, a){
  const w = PGD.armi.find(x => x[0] === a.n);
  if (!w) return {bonus: Number(a.bonus) || 0, danni: a.danni || '', w: null};
  const props = w[4].toLowerCase(), dist = w[3][1] === 'd';
  let car = dist ? 'des' : 'for';
  if (props.includes('accurata')) car = R.md.des >= R.md.for ? 'des' : 'for';
  if (R.c && d.classe === 'Monaco' && !dist && (w[3][0] === 's' || props.includes('leggera') || w[0] === 'Spada corta') && R.md.des > R.md[car]) car = 'des';
  const prof = a.prof == null ? pgWeaponProf(d, w) : !!a.prof;
  const bonus = R.md[car] + (prof ? R.pb : 0) + (Number(a.bonus) || 0);
  const dmgMod = R.md[car] + (Number(a.bonusD) || 0);
  return {bonus, danni: w[1] === '—' ? '—' : `${w[1]}${dmgMod ? ' ' + sgn(dmgMod) : ''} ${w[2]}`, w, prof, car};
}

  out += `<div class="card"><h3>Privilegi e tratti</h3><p class="muted" style="font-size:14px;margin-top:0">Si aggiornano da soli con il livello. Tocca un privilegio per leggerlo.</p>${feat.join('') || '<p class="empty">Scegli classe, specie e background.</p>'}</div>`;

  if (S.pgOwner || S.pgOff) out += `<div class="card"><h3>Gestione</h3><div class="row"><button data-act="pgdel">Elimina questa scheda</button></div></div>`;
  return out.replace(/<label>([^<]*)<\/label>(<(?:input|select|textarea)\b[^>]*?\bid="([^"]+)")/g, '<label for="$3">$1</label>$2');
}

function pgOpenDoc(id, eroe, base){
  if (!S.db) return;
  if (S.pg[id]) { location.hash = 'pg-' + id; return; }
  const d = base ? {...pgNew(eroe), ...JSON.parse(JSON.stringify(base)), eroe, master: false} : pgNew(eroe); if (!base && id[0] === 'm') d.master = true; S.pg[id] = d;
  S.db.doc(PGC + '/' + id).set(JSON.parse(JSON.stringify(d))).then(() => { location.hash = 'pg-' + id; }).catch(e => { console.error(e); delete S.pg[id]; render(); toast(e && e.code === 'invalid_argument' ? 'Non puoi ancora salvare: chiedi al Master di invitarti come Editor' : 'Scheda non creata'); });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || !t.dataset.act.startsWith('pg')) return;
  const a = t.dataset.act, id = S.pgId, d = S.pg[id];
  if (a === 'pgall') { S.pgAll = t.checked; render(); return; }
  if (a === 'pgcalc') { const ae = document.activeElement; if (ae && ae.blur) ae.blur(); for (const el of document.querySelectorAll('#work [data-pid][data-pg]')) { if (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.dataset.pg[0] !== '_' && pgCanEd(el.dataset.pid) && S.pg[el.dataset.pid]) { let v = el.value; if (el.getAttribute('inputmode') === 'numeric' && v !== '') v = Number(String(v).replace(',', '.').replace(/[^\d.-]/g, '')) || 0; pgSet(el.dataset.pid, el.dataset.pg, v); } } render(); toast('Scheda ricalcolata'); return; }
  if (a === 'pgnew') { pgOpenDoc('m' + Date.now().toString(36), t.dataset.eroe); return; }
  if (a === 'pgmine') { if (S.uid) pgOpenDoc(S.uid, t.dataset.eroe); else toast('Accedi a Claude per creare la tua scheda'); return; }
  if (a === 'pgtake') { const src = S.pg[t.dataset.k]; if (S.uid && src) pgOpenDoc(S.uid, src.eroe, src); return; }
  if (a === 'pgnewmine') { const n = ($('#pg-nuovo').value || '').trim(); if (!n) { toast("Scrivi il nome dell'eroe"); return; } if (Object.values(S.pg).some(x => x.eroe === n) ) { toast('Esiste già un eroe con questo nome'); return; } if (S.uid) pgOpenDoc(S.uid, n); else toast('Accedi a Claude per creare la tua scheda'); return; }
  if (a === 'pgaddg') { const x = S.pg[t.dataset.k]; if (x && (S.pgOwner || S.pgOff) && !S.eroi.some(e => e.nome === x.eroe)) { S.eroi.push({nome: x.eroe, pe: 0}); saveGroup(); render(); toast(x.eroe + ' aggiunto al gruppo'); } return; }
  if (a === 'pgdelk') { if (!(S.pgOwner || S.pgOff)) return; if (t.dataset.ok !== '1') { t.dataset.ok = '1'; t.textContent = 'Conferma'; return; } const k = t.dataset.k; delete S.pg[k]; S.db && S.db.doc(PGC + '/' + k).delete().catch(e => console.error(e)); render(); return; }
  if (!d || !pgCanEd(id)) return;
  if (a === 'pgdelw') { d.armi.splice(Number(t.dataset.i), 1); }
  else if (a === 'pgdels') { d.spell = (d.spell || []).filter(n => n !== t.dataset.n); }
  else if (a === 'pgdelt') { d.tal = (d.tal || []).filter(n => n !== t.dataset.n); }
  else if (a === 'pgrest') {
    const R = pgCalc(d);
    if (t.dataset.k === 'lungo') { d.pfAtt = ''; d.pfTemp = ''; d.slotUsati = []; d.morte = [0, 0]; d.dvSpesi = PG5 ? 0 : Math.max(0, (Number(d.dvSpesi) || 0) - Math.max(1, Math.floor(R.L / 2))); toast('Riposo lungo: punti ferita e slot recuperati'); }
    else { if (R.mag && R.mag.patto) d.slotUsati = []; toast(R.mag && R.mag.patto ? 'Riposo breve: slot del patto recuperati' : 'Riposo breve: spendi i Dadi Vita per curarti'); }
  }
  else if (a === 'pgdel') { if (t.dataset.ok !== '1') { t.dataset.ok = '1'; t.textContent = 'Conferma: elimina'; return; } delete S.pg[id]; S.db && S.db.doc(PGC + '/' + id).delete().catch(e => console.error(e)); location.hash = 'pg'; return; }
  pgSave(id); render();
});
document.addEventListener('focusin', e => { const t = e.target; if (S.pgTyping && S.pgTyping.id === t.id && Date.now() - S.pgTyping.t < 2000) return; if (t && t.dataset && t.dataset.pid && t.getAttribute && t.getAttribute('inputmode') === 'numeric' && !t.disabled) { try { t.select(); } catch (_) {} } });
document.addEventListener('toggle', e => { const t = e.target; if (t.dataset && t.dataset.pgo) S.pgOpen[t.dataset.pgo] = t.open; }, true);
function pgInput(t, live){
  S.pgTyping = {id: t.id, t: Date.now()};
  const id = t.dataset.pid, d = S.pg[id]; if (!d || !pgCanEd(id)) return;
  if (t.dataset.pgm != null) { const k = Number(t.dataset.pgm), n = Number(t.dataset.n); d.morte[k] = t.checked ? n : n - 1; pgSave(id); render(); return; }
  if (t.dataset.pgs != null) { const k = Number(t.dataset.pgs), n = Number(t.dataset.n); d.slotUsati = d.slotUsati || []; d.slotUsati[k] = t.checked ? n : n - 1; for (let i = 0; i < k; i++) if (d.slotUsati[i] == null) d.slotUsati[i] = 0; pgSave(id); render(); return; }
  if (t.dataset.pgab != null) { const a = d.armi[Number(t.dataset.pgab)]; a.bonus = Number(String(t.value).replace(/[^\d-]/g, '')) || 0; pgSave(id); if (!live) render(); else { clearTimeout(S.rt); render(); } return; }
  if (t.dataset.pga != null) { d.armi[Number(t.dataset.pga)].prof = t.checked; pgSave(id); render(); return; }
  const p = t.dataset.pg; if (!p) return;
  if (p === '_addw') { if (t.value) { d.armi = d.armi || []; d.armi.push({n: t.value}); pgSave(id); } render(); return; }
  if (p === '_adds') { if (t.value) { d.spell = d.spell || []; d.spell.push(t.value); pgSave(id); } render(); return; }
  if (p === '_addt') { if (t.value) { d.tal = d.tal || []; d.tal.push(t.value); pgSave(id); } render(); return; }
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if (t.getAttribute('inputmode') === 'numeric' && v !== '') v = Number(String(v).replace(',', '.').replace(/[^\d.-]/g, '')) || 0;
  if (p === 'metodo' && v === 'array') d.base = {for: 15, des: 14, cos: 13, int: 12, sag: 10, car: 8};
  if (p === 'metodo' && v === 'punti') d.base = {for: 8, des: 8, cos: 8, int: 8, sag: 8, car: 8};
  if (p.startsWith('base.') && d.metodo === 'array') { const a = p.slice(5), old = Number(d.base[a]), nv = Number(v), o = PCARK.find(k => k !== a && Number(d.base[k]) === nv); if (o) d.base[o] = old; }
  pgSet(id, p, p.startsWith('base.') && d.metodo === 'array' ? Number(v) : v);
  if (live && t.getAttribute('inputmode') !== 'numeric') { clearTimeout(S.rt); S.rt = setTimeout(render, 400); } else { clearTimeout(S.rt); render(); }
}
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.pid && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type !== 'checkbox'))) pgInput(t, true); });
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.pid && (t.tagName === 'SELECT' || t.type === 'checkbox')) pgInput(t, false); else if (t.dataset && t.dataset.pid && t.dataset.pg && t.dataset.pg[0] !== '_') { clearTimeout(S.rt); render(); } if (t.dataset && t.dataset.pglink) { const k = t.dataset.pglink; if (t.value && S.pg[k] && pgCanEd(k)) { S.pg[k].eroe = t.value; pgSave(k); render(); } } });
(async () => {
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (user) { try { S.pgOwner = !!(await user.isOwner()); } catch (_) {} try { S.uid = user.id ? await user.id() : null; } catch (_) { S.uid = null; } }
    S.pgOff = !!window.OFF;
    if (!db) { S.pgLoaded = true; render(); return; }
    db.collection(PGC).onSnapshot(s => {
      const o = {};
      for (const x of s.docs) { const cur = S.pg[x.id]; o[x.id] = (cur && (pgBusy(x.id) || (x.metadata && x.metadata.hasPendingWrites))) ? cur : {...pgNew(''), ...JSON.parse(JSON.stringify(x.data() || {}))}; }
      S.pg = o; S.pgLoaded = true;
      const ae = document.activeElement; if (ae && ae.dataset && ae.dataset.pid && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
      if (S.view === 'pg' || S.view === 'pgscheda') render();
    }, e => { console.error(e); S.pgLoaded = true; });
  } catch (e) { console.error(e); }
})();

function sugg(q){
  const n = norm(q); if (!n) return [];
  const pre = [], mid = [];
  for (const b of B) { const a = norm(b.nome), e = norm(b.en); if (a.startsWith(n) || e.startsWith(n)) pre.push(b); else if (a.includes(n) || e.includes(n)) mid.push(b); }
  return [...pre.sort((x,y)=>x.nome.length-y.nome.length), ...mid].slice(0, 6);
}

function fastGo(d){
  const L = S.bulk; let i = S.fast + d;
  if (d > 0) { let k = i; while (k < L.length && L[k].id != null) k++; if (k < L.length) i = k; }
  if (i >= L.length) { S.fast = null; render(); toast('Arrivato alla fine: controlla e salva'); return; }
  S.fast = Math.max(0, i); S.sel = 0; render(); const f = $('#fastin'); if (f) { f.value = ''; f.focus(); }
}

async function shrink(file, max = 560){
  const url = URL.createObjectURL(file), im = new Image();
  try {
    await new Promise((ok, ko) => { im.onload = ok; im.onerror = ko; im.src = url; });
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    let q = 0.8, src = c.toDataURL('image/jpeg', q);
    while (src.length > 300000 && q > 0.4) { q -= 0.12; src = c.toDataURL('image/jpeg', q); }
    return src;
  } finally { URL.revokeObjectURL(url); }
}
async function upload(id, file){
  if (!file.type.startsWith('image/')) { toast('Scegli un file immagine'); return; }
  try {
    const src = await shrink(file);
    S.imgs['m'+id] = src; save('e55immagini/m'+id, {src, nome: B[id].nome}); render();
    toast(S.db ? 'Immagine salvata' : 'Immagine visibile solo in questa pagina');
  } catch (err) { console.error(err); toast('Immagine non leggibile'); }
}
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\.[a-z0-9]{2,5}$/,'').replace(/[^a-z0-9]+/g,' ').trim();
const NAMES = B.flatMap(b => [[norm(b.nome), b.id], [norm(b.en), b.id]]).sort((a, c) => c[0].length - a[0].length);
function guess(fn){
  const n = norm(fn.split('/').pop()), ex = NAMES.find(([k]) => k === n);
  if (ex) return ex[1];
  const sg = SUGG.find(s => { const k = norm(s.file); return n === k || n.includes(k); });
  if (sg) return sg.id;
  const c = NAMES.find(([k]) => k.length > 3 && (' ' + n + ' ').includes(' ' + k + ' '));
  return c ? c[1] : null;
}
const IMG_EXT = /\.(jpe?g|png|webp|gif|bmp)$/i;
let zipLib = null;
function loadZipLib(){
  return zipLib || (zipLib = new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload = () => ok(window.JSZip); s.onerror = ko; document.head.appendChild(s); }));
}
function bulkMsg(m){ const el = $('#bulkst'); if (el) el.textContent = m; }
async function bulkAdd(list){
  let files = [];
  for (const f of list) {
    if (/\.zip$/i.test(f.name)) {
      try {
        bulkMsg('Apro ' + f.name + '…');
        const Z = await loadZipLib(), z = await Z.loadAsync(f);
        for (const e of Object.values(z.files)) if (!e.dir && IMG_EXT.test(e.name) && !e.name.includes('__MACOSX')) {
          const blob = await e.async('blob'), ext = e.name.split('.').pop().toLowerCase();
          files.push(new File([blob], e.name.split('/').pop(), {type: 'image/' + (ext === 'jpg' ? 'jpeg' : ext)}));
        }
      } catch (err) { console.error(err); toast('Non riesco ad aprire ' + f.name); }
    } else if (f.type.startsWith('image/') || IMG_EXT.test(f.name)) files.push(f);
  }
  if (!files.length) { bulkMsg('Nessuna immagine trovata.'); return; }
  S.bulk = S.bulk || [];
  for (let i = 0; i < files.length; i++) {
    bulkMsg(`Preparo ${i+1} di ${files.length}…`);
    try { S.bulk.push({name: files[i].name, src: await shrink(files[i]), id: guess(files[i].name)}); } catch (err) { console.error(err); }
  }
  render();
}
async function bulkSave(){
  const todo = (S.bulk || []).filter(x => x.id != null);
  if (!todo.length) return;
  S.saving = true;
  for (let i = 0; i < todo.length; i++) {
    const x = todo[i];
    bulkMsg(`Salvo ${i+1} di ${todo.length}…`);
    S.imgs['m' + x.id] = x.src;
    if (S.db && S.canWrite) {
      try { await S.db.doc('e55immagini/m' + x.id).set({src: x.src, nome: B[x.id].nome}); x.done = true; }
      catch (err) { console.error(err); x.err = true; if (err && err.code === 'invalid_argument') { S.canWrite = false; break; } }
    } else x.done = true;
  }
  const ok = todo.filter(x => x.done).length, ko = todo.filter(x => x.err).length;
  S.bulk = S.bulk.filter(x => !x.done); S.saving = false; render();
  toast(ko ? `${ok} salvate, ${ko} non riuscite` : `${ok} immagini salvate`);
}
function loadImg(id){
  const k = 'm' + id;
  if (!S.db || k in S.imgs) return;
  S.imgs[k] = null;
  S.db.doc('e55immagini/' + k).get().then(s => { const x = s.exists ? s.data() : null; S.imgs[k] = x && typeof x.src === 'string' && x.src.startsWith('data:image/') ? x.src : ''; if (S.view === 'mostro' && S.mid === id) render(); }).catch(e => { console.error(e); S.imgs[k] = ''; });
}
document.addEventListener('dragover', e => { const p = e.target.closest && e.target.closest('#pic'); if (p && S.canWrite) { e.preventDefault(); p.classList.add('drop'); } });
document.addEventListener('dragleave', e => { const p = e.target.closest && e.target.closest('#pic'); if (p) p.classList.remove('drop'); });
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('#bulkdrop'); if (z) { e.preventDefault(); z.classList.add('drop'); } });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('#bulkdrop'); if (z) { e.preventDefault(); z.classList.remove('drop'); if (ED()) bulkAdd([...e.dataTransfer.files]); } });
document.addEventListener('drop', e => { const p = e.target.closest && e.target.closest('#pic'); if (!p || !S.canWrite) return; e.preventDefault(); p.classList.remove('drop'); const f = e.dataTransfer.files[0]; if (f && ED()) upload(Number(p.dataset.id), f); });
$('#veil').addEventListener('click', e => { if (e.target.id === 'veil') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#veil').hidden) closeSheet(); });
route();
fetch('mostri55.json', {cache: 'no-cache'}).then(r => r.json()).then(d => { ST = d; render(); }).catch(e => { console.error(e); toast('Schede non caricate'); });
(async () => {
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db) return;
    S.db = db; S.canWrite = !!(user && (user.isOwner() || user.canEdit()));
    db.doc('e55stato/gruppo').onSnapshot(s => { if (s.exists && s.data().eroi && !s.metadata.hasPendingWrites) { S.eroi = JSON.parse(JSON.stringify(s.data().eroi)); render(); } }, e => console.error(e));
    if (S.view === 'mostro') loadImg(S.mid);
    db.collection('e55schede').onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.schede = o; render(); }, e => console.error(e));
    db.collection('e55incontri').onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.saved = o; render(); }, e => console.error(e));
  } catch(e) { console.error(e); }
})();
}
