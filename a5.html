/* Sala d'Armi 5: stessa struttura della Sala d'Armi, regole e mostri della quinta edizione.
   VOICE: un tavolo da guerra del Master, pratico e veloce, da usare mentre si gioca.
   IDEA: il tabellone della sala d'armi: ferro, braci e gettoni di ottone sul tavolo.

:root{color-scheme:light dark;

label{font-size:14px;color:var(--soft);display:block;margin:6px 0 2px}

// ---------- regole
const XPLV = [0,300,900,2700,6500,14000,23000,34000,48000,64000,85000,100000,120000,140000,165000,195000,225000,265000,305000,355000];

// PE per personaggio: 5 = soglie della Guida del DM 2014 (facile, media, difficile, mortale); 5.5 = budget dell'SRD 5.2.1 (facile, media, difficile)
const SOGLIE = ED5 === '5' ? [null,[25,50,75,100],[50,100,150,200],[75,150,225,400],[125,250,375,500],[250,500,750,1100],[300,600,900,1400],[350,750,1100,1700],[450,900,1400,2100],[550,1100,1600,2400],[600,1200,1900,2800],[800,1600,2400,3600],[1000,2000,3000,4500],[1100,2200,3400,5100],[1250,2500,3800,5700],[1400,2800,4300,6400],[1600,3200,4800,7200],[2000,3900,5900,8800],[2100,4200,6300,9500],[2400,4900,7300,10900],[2800,5700,8500,12700]]
  : [null,[50,75,100],[100,150,200],[150,225,400],[250,375,500],[500,750,1100],[600,1000,1400],[750,1300,1700],[1000,1700,2100],[1300,2000,2600],[1600,2300,3100],[1900,2900,4100],[2200,3700,4700],[2600,4200,5400],[2900,4900,6200],[3300,5400,7800],[3800,6100,9800],[4500,7200,11700],[5000,8700,14200],[5500,10700,17200],[6400,13200,22000]];
const soglie = () => DIFF.map((_,k) => S.eroi.reduce((s,e)=>s + SOGLIE[livello(e.pe)][k], 0));
const peOf = x => (B[x.id] ? B[x.id].pe : x.pe) || 0;
const MOLT = [0.5,1,1.5,2,2.5,3,4,5];
function molt(n){
  if (ED5 !== '5') return 1;
  let i = n<=1?1 : n===2?2 : n<=6?3 : n<=10?4 : n<=14?5 : 6;
  const p = S.eroi.length; if (p < 3) i++; else if (p >= 6) i--;
  return MOLT[Math.max(0, Math.min(7, i))];
}
const encBase = voci => voci.reduce((s,v)=>s + v.n*peOf(v), 0);
const encN = voci => voci.reduce((s,v)=>s + v.n, 0);
function encXP(voci){ if (!voci || !voci.length) return null; return Math.round(encBase(voci) * molt(encN(voci))); }
const encounterLevel = encXP;
function difficulty(xp){
  if (xp == null) return null;
  const t = soglie(); let k = -1;
  for (let i = 0; i < t.length; i++) if (xp >= t[i]) k = i;
  if (ED5 !== '5') { // 2024: il budget è un tetto
    if (xp > t[2]) return ['Oltre il difficile',4];
    if (xp > t[1]) return ['Difficile',3];
    if (xp > t[0]) return ['Media',2];
    return xp >= t[0]/2 ? ['Facile',1] : ['Banale',0];
  }
  if (k < 0) return ['Banale',0];
  return [DIFF[k], k+1];
}
const dIdx = diff => Math.max(0, DIFF.indexOf(diff));
function range(diff){ const t = soglie(), k = dIdx(diff); if (ED5 !== '5') return [k ? t[k-1]+1 : Math.ceil(t[0]/2), t[k]+1]; return [t[k], k+1 < t.length ? t[k+1] : Math.round(t[k]*1.5)]; }
function neededPE(diff, n){ const [lo, hi] = range(diff), m = n*molt(n); return {lo, hi, a: Math.ceil(lo/m), b: Math.max(Math.ceil(lo/m), Math.floor((hi-1)/m))}; }
const same = (a,b) => Math.abs(a-b) < 0.02;

// ---------- generatore misto
const rnd = a => a[Math.floor(Math.random()*a.length)];
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const poolOf = tipo => B.filter(b => b.pe > 0 && (!tipo || b.tipo===tipo) && inZona(b, S.gen.zona));
const affine = (list, c) => { const a = list.filter(b => b.tipo===c.tipo || (c.zone!=='*' && [...c.zone].some(z=>b.zone.includes(z)))); return a.length ? a : list; };
const toVoci = arr => arr.map(([b,n]) => ({id:b.id, nome:b.nome, gs:b.gs, pe:b.pe, n}));
const hits = (v, diff) => { const d = difficulty(encXP(v)); return d && d[0] === diff; };
function single(diff, pool){
  for (const n of [ri(1,6), ri(1,4), 1, 2, 3, 4, 6, 8]) {
    const {a, b} = neededPE(diff, n), l = pool.filter(x => x.pe >= a && x.pe <= b);
    if (l.length) return toVoci([[rnd(l), n]]);
  }
  return null;
}
function mixed(forma, diff, pool, aff){
  const [lo, hi] = range(diff);
  for (let t = 0; t < 3000; t++) {
    let arr;
    if (forma === 'capo') {
      const caps = pool.filter(b => b.pe >= lo*0.25 && b.pe <= hi*0.6); if (!caps.length) return null;
      const c = rnd(caps); let g = pool.filter(b => b.id !== c.id && b.pe <= c.pe/3);
      if (aff) g = affine(g, c); if (!g.length) continue;
      arr = [[c,1],[rnd(g), ri(2,8)]];
    } else {
      const k = forma === 'due' ? 2 : 3, p = pool.filter(b => b.pe <= hi/(k+1)); if (p.length < k) return null;
      const a = rnd(p); arr = [[a, ri(1, k===2?6:4)]];
      while (arr.length < k) { let q = p.filter(b => !arr.some(([x]) => x.id === b.id)); if (aff) q = affine(q, a); arr.push([rnd(q), ri(1, k===2?6:4)]); }
    }
    const v = toVoci(arr); if (hits(v, diff)) return v;
  }
  return null;
}
function makeMix(){
  const g = S.gen, pool = poolOf(g.tipo), out = [];
  for (let i = 0; i < 12 && out.length < 3; i++) { const v = mixed(g.forma, g.diff, pool, g.affini); if (v && !out.some(o => JSON.stringify(o)===JSON.stringify(v))) out.push(v); }
  S.mix = out;
}
const TAB = [[1,'Facile'],[2,'Facile'],[3,'Media'],[4,'Media'],[5,'Media'],[6,'Difficile'],[7,'Difficile'],[8, ED5==='5' ? 'Mortale' : 'Difficile']];
function makeTab(){
  const pool = poolOf(S.gen.tipo);
  S.roll = null;
  S.tab = TAB.map(([d,lab]) => {
    const forma = rnd(['single','single','capo','due']);
    const v = (forma === 'single' ? single(lab, pool) : mixed(forma, lab, pool, true)) || single(lab, pool) || mixed('capo', lab, pool, false);
    return {d, lab, voci: v};
  });
}

const filtri = (g, withN) => `<div class="grid4"><div><label for="g-diff">Difficoltà</label><select id="g-diff" data-g="diff">${DIFF.map(d=>`<option ${g.diff===d?'selected':''}>${d}</option>`).join('')}</select></div>
  ${withN ? `<div><label for="g-n">Quante creature</label><select id="g-n" data-g="n">${Array.from({length:12},(_,i)=>`<option ${g.n===i+1?'selected':''}>${i+1}</option>`).join('')}</select></div>`
          : `<div><label for="g-f">Forma</label><select id="g-f" data-g="forma">${FORME.map(([k,l])=>`<option value="${k}" ${g.forma===k?'selected':''}>${l}</option>`).join('')}</select></div>`}
  <div><label for="g-tipo">Tipo</label><select id="g-tipo" data-g="tipo"><option value="">Qualsiasi</option>${TIPI.map(t=>`<option ${g.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label for="g-zona">Luogo</label><select id="g-zona" data-g="zona"><option value="">Qualsiasi</option>${zoneOpt(g.zona)}</select></div></div>`;

function genView(){
  const g = S.gen;
  const seg = `<div class="seg" role="group" aria-label="Modalità">${[['singola','Una specie'],['misto','Misto'],['tabella','Tabella del luogo']].map(([k,l])=>`<button data-act="mode" data-m="${k}" class="${g.mode===k?'on':''}" aria-pressed="${g.mode===k}">${l}</button>`).join('')}</div>`;
  if (g.mode === 'misto') return mixView(seg);
  if (g.mode === 'tabella') return tabView(seg);
  const {lo, hi, a, b} = neededPE(g.diff, g.n);
  const list = poolOf(g.tipo).filter(x => x.pe >= a && x.pe <= b).sort((x,y)=>y.pe-x.pe || x.nome.localeCompare(y.nome,'it'));
  const pick = S.pick != null ? B[S.pick] : null;
  return `<div class="card"><h2>Generatore di incontri</h2>${seg}${filtri(g, true)}
  <p style="margin:14px 0 6px">Incontro <b>${g.diff.toLowerCase()}</b> per questo gruppo: da ${fmt(lo)} a <b>${fmt(hi-1)}</b> PE${ED5==='5'&&molt(g.n)!==1?` (già moltiplicati per ${String(molt(g.n)).replace('.',',')})`:''} → ${g.n} creatur${g.n>1?'e':'a'} da <b>${fmt(a)}–${fmt(b)} PE</b>${g.n>1?' ciascuna':''}.</p>
  <div class="row"><button class="pri" data-act="rand" ${list.length?'':'disabled'}>Scegli a caso</button><span class="muted">${list.length} creature adatte</span></div>
  ${pick ? `<div class="cand" style="margin-top:12px;border-color:var(--brace)"><b>${g.n} × ${nm(pick.id)}</b><span class="muted">GS ${gsTxt(pick.gs)} · ${fmt(pick.pe)} PE · ${esc(pick.tipo)} · ${esc(zoneTxt(pick))}</span>${statLine(pick)}<div class="row" style="margin-top:8px"><button class="sm pri" data-act="add" data-id="${pick.id}" data-n="${g.n}">Aggiungi all'incontro</button></div></div>`:''}</div>
  <div class="card"><h3>Tutte le creature adatte</h3>${list.length ? `<div class="cands">${list.map(x=>`<div class="cand">${nm(x.id)}<span class="muted">GS ${gsTxt(x.gs)} · ${fmt(x.pe)} PE · ${esc(x.tipo)} · ${esc(zoneTxt(x))}</span>${statLine(x)}<div class="row" style="margin-top:6px"><button class="sm" data-act="add" data-id="${x.id}" data-n="${g.n}">Aggiungi ${g.n}</button></div></div>`).join('')}</div>`
    : (() => { const alt = Array.from({length:12},(_,i)=>i+1).filter(k => { const r = neededPE(g.diff, k); return poolOf(g.tipo).some(x => x.pe >= r.a && x.pe <= r.b); });
      return `<p class="empty">Nessuna creatura da ${fmt(a)}–${fmt(b)} PE con questi filtri: i PE dei mostri salgono a gradini.${alt.length ? ` Funziona con ${alt.slice(0,6).map(k=>`<button class="sm" data-act="setn" data-n="${k}">${k}</button>`).join(' ')} creature.` : ' Togli un filtro.'}</p>`; })()}</div>`;
}

function mixView(seg){
  const g = S.gen, [lo, hi] = range(g.diff);
  const forma = {capo:'un capo più forte e un gruppo di gregari più deboli', due:'due specie diverse in numero variabile', trio:'tre specie diverse, poche per tipo'}[g.forma];
  return `<div class="card"><h2>Generatore misto</h2>${seg}${filtri(g, false)}
  <label class="chk"><input type="checkbox" data-g="affini" ${g.affini?'checked':''}> Creature affini: dello stesso tipo della prima</label>
  <p style="margin:8px 0">Incontro <b>${g.diff.toLowerCase()}</b>: da ${fmt(lo)} a ${fmt(hi-1)} PE${ED5==='5'?' (con il moltiplicatore per il numero di creature)':''}, con ${forma}.</p>
  <div class="row"><button class="pri" data-act="mix">${S.mix?'Altre proposte':'Proponi tre incontri'}</button></div></div>
  ${S.mix ? `<div class="card"><h3>Proposte</h3>${S.mix.length ? S.mix.map((v,k)=>{ const x = encXP(v), d = difficulty(x); return `<div class="prop"><div class="row" style="justify-content:space-between"><b>Proposta ${k+1}</b><span><b>${fmt(x)} PE</b> <span class="badge d${d[1]}">${d[0]}</span></span></div>${vociHtml(v)}<button class="sm pri" data-act="addmix" data-k="${k}">Aggiungi all'incontro</button></div>`; }).join('')
    : `<p class="empty">Non trovo combinazioni ${g.diff.toLowerCase()} con questi filtri. Togli un filtro, cambia forma o difficoltà.</p>`}</div>` : ''}`;
}

function tabView(seg){
  const g = S.gen;
  return `<div class="card"><h2>Tabella del luogo</h2>${seg}
  <div class="grid4"><div><label for="g-zona">Luogo</label><select id="g-zona" data-g="zona"><option value="">Qualsiasi</option>${zoneOpt(g.zona)}</select></div><div><label for="g-tipo">Tipo</label><select id="g-tipo" data-g="tipo"><option value="">Qualsiasi</option>${TIPI.map(t=>`<option ${g.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div></div>
  <p class="muted" style="margin:10px 0">Una tabella d8 di incontri casuali per questo gruppo: due facili, tre medi, ${ED5==='5'?'due difficili e uno mortale':'tre difficili'}.</p>
  <div class="row"><button class="pri" data-act="tab">${S.tab?'Nuova tabella':'Crea la tabella'}</button>${S.tab?`<button data-act="roll">Tira 1d8</button>`:''}${S.roll?`<span class="badge d2">Uscito ${S.roll}</span>`:''}</div></div>
  ${S.tab ? `<div class="card scroll"><table class="d8"><thead><tr><th>d8</th><th>Incontro</th><th class="n">PE</th><th></th></tr></thead><tbody>${S.tab.map((r,k)=>`<tr class="${S.roll===r.d?'hit':''}"><td>${r.d}</td><td>${r.voci ? r.voci.map(x=>`${x.n} × ${nm(x.id)}`).join(', ') : '<span class="muted">Nessuna combinazione adatta</span>'}<span class="mini">${r.lab}</span></td><td class="n">${r.voci?fmt(encXP(r.voci)):'—'}</td><td class="n">${r.voci?`<button class="sm" data-act="addtab" data-k="${k}" aria-label="Aggiungi la riga ${r.d} all'incontro">+</button>`:''}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
}

const sOf = b => (ST && ST[b.id]) || null;
const pfOf = s => String(s.pf).split(' ')[0];
const caOf = s => String(s.ca).split(' ')[0];
const statLine = b => { const s = sOf(b); return s ? `<span class="stat">CA ${esc(caOf(s))} · PF ${esc(pfOf(s))} · ${fmt(b.pe)} PE</span>` : ''; };
const nomeAz = p => { const m = /^([^.:]{1,80}?)\. /.exec(p); return m ? m[1] : null; };
function openSheet(id){
  const b = B[id], s = sOf(b), v = $('#veil');
  const rows = s ? [['Taglia e tipo', `${s.taglia} · ${b.tipo}`],['Classe Armatura', s.ca],['Punti ferita', s.pf],['Velocità', s.vel],['Azioni', (s.azioni||[]).map(nomeAz).filter(Boolean).join(', ')],['Grado di Sfida', s.gsr]] : [];
  $('#sheet').innerHTML = `<div class="row" style="justify-content:space-between;align-items:start"><div><h2 id="sh-t" style="margin:0">${esc(b.nome)}</h2><span class="muted">GS ${gsTxt(b.gs)} · ${fmt(b.pe)} PE</span></div><button class="sm" data-act="close" aria-label="Chiudi la scheda">✕</button></div>
  <dl>${rows.map(([k,x])=>`<dt>${k}</dt><dd>${esc(x)}</dd>`).join('')}</dl>
  <div class="row"><a class="btnl" href="#m-${b.id}" data-act="close">Scheda completa</a><button class="pri" data-act="add" data-id="${b.id}" data-n="1">Aggiungi 1 all'incontro</button><button data-act="close">Chiudi</button></div>`;
  S.back = document.activeElement; v.hidden = false; $('#sheet [data-act=close]').focus();
}
function closeSheet(){ $('#veil').hidden = true; if (S.back && document.contains(S.back)) S.back.focus(); }

function bestView(){
  const q = S.q.trim().toLowerCase(), gv = x => x==='' ? null : x.includes('/') ? (([a,b]) => a/b)(x.split('/').map(Number)) : Number(x);
  const lo = gv(S.gsMin) ?? -1, hi = gv(S.gsMax) ?? 99;
  let list = B.filter(b => (!q || b.nome.toLowerCase().includes(q) || b.en.toLowerCase().includes(q)) && (!S.fTipo || b.tipo===S.fTipo) && inZona(b, S.fZona) && b.gs >= lo - 0.01 && b.gs <= hi + 0.01);
  list = list.sort(S.sort==='nome' ? (a,b)=>a.nome.localeCompare(b.nome,'it') : (a,b)=>a.gs-b.gs || a.nome.localeCompare(b.nome,'it'));
  return `<div class="card"><h2>Bestiario</h2><p class="muted">${B.length} creature ${ED5==='5' ? "dell'SRD 5.1 (regole 2014), tradotte in italiano" : "dell'SRD 5.2.1 (regole 2024), in italiano"}. Tocca un nome per aprire la sua scheda completa.${ED()?' <a href="#immagini">Carica immagini in blocco</a>.':''}</p>
  <div class="grid4"><div><label for="b-q">Cerca</label><input id="b-q" data-b="q" value="${esc(S.q)}" placeholder="${ED5==='5'?'Nome italiano o inglese':'Nome'}"></div>
  <div><label for="b-t">Tipo</label><select id="b-t" data-b="fTipo"><option value="">Tutti</option>${TIPI.map(t=>`<option ${S.fTipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
  <div><label for="b-z">Luogo</label><select id="b-z" data-b="fZona"><option value="">Tutti</option>${zoneOpt(S.fZona)}</select></div>
  <div class="row" style="align-items:end;flex-wrap:nowrap"><div><label for="b-lo">GS da</label><input id="b-lo" data-b="gsMin" inputmode="numeric" value="${esc(S.gsMin)}"></div><div><label for="b-hi">a</label><input id="b-hi" data-b="gsMax" inputmode="numeric" value="${esc(S.gsMax)}"></div></div></div>
  <p class="muted" style="margin:10px 0 0">${list.length} risultati · ordina per <button class="sm" data-act="sort" data-s="gs" ${S.sort==='gs'?'disabled':''}>GS</button> <button class="sm" data-act="sort" data-s="nome" ${S.sort==='nome'?'disabled':''}>nome</button></p></div>
  <div class="card scroll"><table><thead><tr><th>Creatura</th><th class="n">GS</th><th>Tipo</th><th>Luogo</th><th class="n">PE</th><th></th></tr></thead><tbody>
  ${list.slice(0,400).map(b=>`<tr><td>${nm(b.id)}${b.en?`<br><span class="muted">${esc(b.en)}</span>`:''}<br>${statLine(b)}</td><td class="n">${gsTxt(b.gs)}</td><td>${esc(b.tipo)}</td><td>${esc(zoneTxt(b))}</td><td class="n">${fmt(b.pe)}</td><td class="n"><button class="sm" data-act="add" data-id="${b.id}" data-n="1" aria-label="Aggiungi ${esc(b.nome)} all'incontro">+</button></td></tr>`).join('')}
  </tbody></table>${!list.length?'<p class="empty">Nessuna creatura trovata.</p>':''}${CREDITI}</div>`;
}

const ORD = [...B].sort((a,b)=>a.gs-b.gs || a.nome.localeCompare(b.nome,'it')).map(b=>b.id);
const CARN = ['For','Des','Cos','Int','Sag','Car'];
const para = p => { const m = /^([^.:]{1,80}?)\. ([\s\S]*)$/.exec(p), nn = m && m[1].replace(/\([^)]*\)/g,''); const br = t => esc(t).replace(/ ((?:\d+\/giorno(?: ciascuno)?|A volontà|At will|\d+\/day(?: each)?):)/g,'<br>$1'); return m && !nn.includes(',') && nn.trim().split(/\s+/).length <= 6 ? `<p><b><i>${esc(m[1])}.</i></b> ${br(m[2])}</p>` : `<p>${br(p)}</p>`; };
const SEZ = [['tratti','Tratti'],['azioni','Azioni'],['bonus','Azioni bonus'],['reazioni','Reazioni'],['legg','Azioni leggendarie']];
const TMAP = {'Bestia':'Animale','Mostruosità':'Bestia magica','Immondo':'Esterno','Celestiale':'Esterno','Drago':'Bestia magica'};
function monsterView(){
  const b = B[S.mid], s = sOf(b), k = ORD.indexOf(b.id), prev = B[ORD[k-1]], next = B[ORD[k+1]];
  if (!s) return `<div class="card"><h2>${esc(b.nome)}</h2><p class="empty">Carico la scheda…</p></div>`;
  const top = [['Classe Armatura', s.ca], ...(ED5==='5.5' ? [['Iniziativa', s.ini]] : []), ['Punti ferita', s.pf], ['Velocità', s.vel]];
  const mid = [['Tiri salvezza', s.ts],['Abilità', s.abil],['Vulnerabilità', s.vuln],['Resistenze', s.res],[ED5==='5'?'Immunità ai danni':'Immunità', s.imm],['Immunità alle condizioni', s.cimm],['Attrezzatura', s.attr],['Sensi', s.sensi],['Lingue', s.lingue],['Luogo', zoneTxt(b)],['Grado di Sfida', s.gsr]].filter(r => r[1]);
  const tr = rows => `<table class="sb"><tbody>${rows.map(([l,v])=>`<tr><th scope="row">${l}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`;
  return `<div class="card mon">
  <div class="row" style="justify-content:space-between"><a class="back" href="#bestiario">← Bestiario</a>
    <span class="row">${prev?`<a class="btnl sm2" href="#m-${prev.id}" aria-label="Creatura precedente: ${esc(prev.nome)}">‹ ${esc(prev.nome)}</a>`:''}${next?`<a class="btnl sm2" href="#m-${next.id}" aria-label="Creatura successiva: ${esc(next.nome)}">${esc(next.nome)} ›</a>`:''}</span></div>
  <div class="mhead"><div><h2 style="margin:10px 0 2px">${esc(b.nome)}</h2><span class="muted"><i>${esc(b.tipo)} ${esc(s.taglia)}, ${esc(s.al)}</i>${b.en?` · ${esc(b.en)}`:''}</span></div>
    <div class="gsbox"><span>GS</span><b>${gsTxt(b.gs)}</b></div></div>
  <div class="mtop"><figure class="pic" id="pic" data-id="${b.id}">${S.imgs['m'+b.id] ? `<img src="${esc(S.imgs['m'+b.id])}" alt="${esc(b.nome)}">` : FAM.famOf(b) ? FAM.draw(FAM.famOf(b)) : EMB(TMAP[b.tipo] || b.tipo)}
    <figcaption>${S.imgs['m'+b.id] ? 'Immagine caricata' : 'Illustrazione originale'}</figcaption></figure>
    <div><div class="quick"><div><span>CA</span><b>${esc(caOf(s))}</b></div><div><span>PF</span><b>${esc(pfOf(s))}</b></div><div><span>Iniziativa</span><b>${esc(String(s.ini).split(' ')[0])}</b></div><div><span>PE</span><b>${fmt(b.pe)}</b></div></div>
    ${ED() ? `<div class="row"><label class="btnl up" for="up-img">${S.imgs['m'+b.id]?'Cambia immagine':'Carica un\'immagine'}</label><input type="file" id="up-img" accept="image/*" data-up="${b.id}" hidden>${S.imgs['m'+b.id]?`<button class="sm" data-act="delimg" data-id="${b.id}">Rimuovi</button>`:''}</div><p class="muted" style="font-size:13px;margin:6px 0 0">Oppure trascinala sul riquadro. La vedranno tutti quelli che aprono la Sala d'Armi.</p>` : ''}</div></div>
  ${tr(top)}
  <div class="scroll"><table class="car"><thead><tr><th></th>${CARN.map(c=>`<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>
  <tr><th scope="row">Punteggio</th>${s.car.map(c=>`<td>${c[0]}</td>`).join('')}</tr>
  <tr><th scope="row">Modificatore</th>${s.car.map(c=>`<td>${esc(c[1])}</td>`).join('')}</tr>
  ${ED5==='5.5' ? `<tr><th scope="row">Tiro salvezza</th>${s.car.map(c=>`<td>${esc(c[2]||c[1])}</td>`).join('')}</tr>` : ''}</tbody></table></div>
  ${tr(mid)}
  ${SEZ.filter(([k]) => s[k] && s[k].length).map(([k,l]) => `<h3 class="sez">${l}</h3>${s[k].map(para).join('')}`).join('')}
  <div class="row" style="margin-top:14px"><button class="pri" data-act="add" data-id="${b.id}" data-n="1">Aggiungi 1 all'incontro</button><button data-act="add" data-id="${b.id}" data-n="4">Aggiungi 4</button></div>
  <p class="muted" style="font-size:14px;margin:12px 0 0">${ED5==='5' ? "Dati di gioco dall'SRD 5.1, tradotti in italiano: i nomi, i valori e gli attacchi sono tradotti, alcune descrizioni lunghe delle capacità sono ancora in inglese." : "Dati di gioco dall'SRD 5.2.1 in italiano."}</p></div>`;
}

// ---------- Spellbook
let SP = null, SPload = null;
function loadSP(){
  if (SP || SPload) return;
  SPload = fetch('incantesimi5.json', {cache: 'no-cache'}).then(r => r.json()).then(d => { SP = d.map((s,i) => ({...s, id:i})); render(); }).catch(e => { console.error(e); SPload = null; toast('Incantesimi non caricati'); });
}
const SCUOLE = ['abiurazione','ammaliamento','divinazione','evocazione','illusione','invocazione','necromanzia','trasmutazione'];
const CLASSI = ['Bardo','Chierico','Druido','Mago','Paladino','Ranger','Stregone','Warlock'];
const cap1 = t => t ? t[0].toUpperCase() + t.slice(1) : '';
const lvTxt = s => s.lv === 0 ? `Trucchetto di ${cap1(s.scuola)}` : `${cap1(s.scuola)} di ${s.lv}º livello`;
const spLink = s => `<a class="lnk" href="#s-${s.id}">${esc(s.nome)}</a>`;
function spFilter(){
  const q = (S.spQ||'').trim().toLowerCase();
  return SP.filter(s => (!q || s.nome.toLowerCase().includes(q) || s.en.toLowerCase().includes(q))
    && (S.spLv==='' || S.spLv==null || s.lv === Number(S.spLv)) && (!S.spSc || s.scuola===S.spSc) && (!S.spCl || s.classi.includes(S.spCl))
    && (!S.spCo || (S.spCo==='si') === s.conc) && (!S.spRi || s.rit))
    .sort((a,b) => S.spSort==='lv' ? a.lv-b.lv || a.nome.localeCompare(b.nome,'it') : a.nome.localeCompare(b.nome,'it'));
}
function spellView(){
  loadSP();
  if (!SP) return `<div class="card"><h2>Spellbook</h2><p class="empty">Apro il libro degli incantesimi…</p></div>`;
  const list = spFilter();
  const sel = (id, k, opts, all) => `<select id="${id}" data-b="${k}"><option value="">${all}</option>${opts.map(([v,l])=>`<option value="${v}" ${String(S[k]??'')===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
  return `<div class="card"><h2>Spellbook</h2><p class="muted">${SP.length} incantesimi ${ED5==='5' ? "dell'SRD 5.1 (regole 2014), tradotti in italiano" : "dell'SRD 5.2.1 (regole 2024), in italiano"}. Cerca per nome o filtra, poi tocca un incantesimo per la scheda completa.</p>
  <div class="grid4 sp6"><div style="grid-column:span 2"><label for="sp-q">Cerca</label><input id="sp-q" data-b="spQ" value="${esc(S.spQ||'')}" placeholder="${ED5==='5'?'Nome italiano o inglese':'Per esempio: palla di fuoco'}"></div>
  <div><label for="sp-lv">Livello</label>${sel('sp-lv','spLv',[[0,'Trucchetti'],...[1,2,3,4,5,6,7,8,9].map(n=>[n,n+'º livello'])],'Tutti')}</div>
  <div><label for="sp-cl">Classe</label>${sel('sp-cl','spCl',CLASSI.map(c=>[c,c]),'Tutte')}</div>
  <div><label for="sp-sc">Scuola</label>${sel('sp-sc','spSc',SCUOLE.map(c=>[c,cap1(c)]),'Tutte')}</div>
  <div><label for="sp-co">Concentrazione</label>${sel('sp-co','spCo',[['si','Sì'],['no','No']],'Indifferente')}</div>
  <div><label for="sp-ri">Rituale</label>${sel('sp-ri','spRi',[['si','Solo rituali']],'Indifferente')}</div></div>
  <p class="muted" style="margin:10px 0 0">${list.length} risultati · ordina per <button class="sm" data-act="spsort" data-s="nome" ${S.spSort!=='lv'?'disabled':''}>nome</button> <button class="sm" data-act="spsort" data-s="lv" ${S.spSort==='lv'?'disabled':''}>livello</button></p></div>
  <div class="card scroll"><table class="stack"><thead><tr><th>Incantesimo</th><th class="n">Liv.</th><th>Scuola</th><th>Tempo</th><th>Gittata</th><th>Classi</th></tr></thead><tbody>
  ${list.map(s=>`<tr><td>${spLink(s)}${s.en?`<br><span class="muted">${esc(s.en)}</span>`:''}${s.conc?' <span class="tag">C</span>':''}${s.rit?' <span class="tag">R</span>':''}</td><td class="n">${s.lv||'T'}</td><td>${cap1(s.scuola)}</td><td>${esc(s.tempo)}</td><td>${esc(s.gittata)}</td><td>${esc(s.classi.join(', '))}</td></tr>`).join('')}
  </tbody></table>${list.length?'':'<p class="empty">Nessun incantesimo con questi filtri.</p>'}<p class="mini" style="margin-top:8px">C = concentrazione · R = rituale · T = trucchetto</p>${CREDITI}</div>`;

const LABELS = /^(Utilizzo di uno slot incantesimo di livello superiore|Ai livelli superiori|Trucchetto potenziato|At Higher Levels|Higher-Level Spell Slots?)\. /;
function spPara(p){

}

  let slot = [];
  if (nonPatto.length === 1) slot = own(nonPatto[0]);
  else if (nonPatto.length > 1) { const lc = nonPatto.reduce((s, x) => s + (x.c.cast.t === 'full' ? x.lv : PG5 ? Math.floor(x.lv / 2) : Math.ceil(x.lv / 2)), 0); slot = PGD.slot[Math.min(20, lc)] || []; }

    return {cl: x.n, lv: l, car: k.car, cd: 8 + pb + m, att: pb + m, cant, prep, prepTxt, maxLv};
  }).filter(m => m.maxLv > 0 || m.cant > 0);

}
function pgWeaponProf(d, w){
  const cls = pgClassi(d); if (!cls.length) return false;
  const sp = pgSpe(d), cat = w[3][0], props = w[4].toLowerCase();
  const l = [...cls.flatMap(x => x.c.armiP || []), ...((sp && sp.armiP) || [])];
  if (l.includes(w[0])) return true;
  if (cat === 's' && l.includes('s')) return true;
  if (cat === 'g' && l.includes('g')) return true;
  if (cat === 'g' && l.includes('gal') && (props.includes('accurata') || props.includes('leggera'))) return true;
  if (cat === 'g' && l.includes('gl') && props.includes('leggera')) return true;
  return false;
}
function pgAttack(d, R, a){
  const w = PGD.armi.find(x => x[0] === a.n);
  if (!w) return {bonus: Number(a.bonus) || 0, danni: a.danni || '', w: null};
  const props = w[4].toLowerCase(), dist = w[3][1] === 'd';
  let car = dist ? 'des' : 'for';
  if (props.includes('accurata')) car = R.md.des >= R.md.for ? 'des' : 'for';
  if (R.cls.some(x => x.n === 'Monaco') && !dist && (w[3][0] === 's' || props.includes('leggera') || w[0] === 'Spada corta') && R.md.des > R.md[car]) car = 'des';
  const prof = a.prof == null ? pgWeaponProf(d, w) : !!a.prof;
  const bonus = R.md[car] + (prof ? R.pb : 0) + (Number(a.bonus) || 0);
  const dmgMod = R.md[car] + (Number(a.bonusD) || 0);
  return {bonus, danni: w[1] === '—' ? '—' : `${w[1]}${dmgMod ? ' ' + sgn(dmgMod) : ''} ${w[2]}`, w, prof, car};
}

  out += `<div class="card"><h3>Privilegi, tratti, talenti e incantesimi</h3><p class="muted" style="font-size:14px;margin-top:0">Si aggiornano da soli con il livello. Tocca un privilegio per leggerlo.</p>${feat.join('') || '<p class="empty">Scegli classe, specie e background.</p>'}</div>`;

  out += `<div class="pg2"><div class="card"><h3>Equipaggiamento</h3><div class="pgmon">${['mr', 'ma', 'me', 'mo', 'mp'].map(k => `<div><label>${k}</label>${pgIn(id, 'monete.' + k, (d.monete || {})[k], dis, 'inputmode="numeric"')}</div>`).join('')}</div>

function pgOpenDoc(id, eroe, base){
  if (!S.db) return;
  if (S.pg[id]) { location.hash = 'pg-' + id; return; }
  const d = base ? {...pgNew(eroe), ...JSON.parse(JSON.stringify(base)), eroe, master: false} : pgNew(eroe); if (!base && id[0] === 'm') d.master = true; S.pg[id] = d;
  S.db.doc(PGC + '/' + id).set(JSON.parse(JSON.stringify(d))).then(() => { location.hash = 'pg-' + id; }).catch(e => { console.error(e); delete S.pg[id]; render(); toast(e && e.code === 'invalid_argument' ? 'Non puoi ancora salvare: chiedi al Master di invitarti come Editor' : 'Scheda non creata'); });
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || !t.dataset.act.startsWith('pg')) return;
  const a = t.dataset.act, id = S.pgId, d = S.pg[id];
  if (a === 'pgall') { S.pgAll = t.checked; render(); return; }
  if (a === 'pgall35') { S.pgAll35 = t.checked; render(); return; }
  if (a === 'pgcalc') { const ae = document.activeElement; if (ae && ae.blur) ae.blur(); for (const el of document.querySelectorAll('#work [data-pid][data-pg]')) { if (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.dataset.pg[0] !== '_' && pgCanEd(el.dataset.pid) && S.pg[el.dataset.pid]) { let v = el.value; if (el.getAttribute('inputmode') === 'numeric' && v !== '') v = Number(String(v).replace(',', '.').replace(/[^\d.-]/g, '')) || 0; pgSet(el.dataset.pid, el.dataset.pg, v); } } render(); toast('Scheda ricalcolata'); return; }
  if (a === 'pgexp') { if (!d) return; const blob = new Blob([JSON.stringify({tavolo: 'scheda', ed: PGD.ed, data: new Date().toISOString(), scheda: d}, null, 1)], {type: 'application/json'});
    const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = 'scheda-' + String(d.eroe || 'eroe').replace(/[^\w\-àèéìòù ]/gi, '').trim().replace(/\s+/g, '-') + '-' + PGD.ed + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(l.href), 5000); toast('Scheda esportata'); return; }
  if (a === 'pgnew') { pgOpenDoc('m' + Date.now().toString(36), t.dataset.eroe); return; }
  if (a === 'pgmine') { if (S.uid) pgOpenDoc(S.uid, t.dataset.eroe); else toast('Accedi a Claude per creare la tua scheda'); return; }
  if (a === 'pgtake') { const src = S.pg[t.dataset.k]; if (S.uid && src) pgOpenDoc(S.uid, src.eroe, src); return; }
  if (a === 'pgnewmine') { const n = ($('#pg-nuovo').value || '').trim(); if (!n) { toast("Scrivi il nome dell'eroe"); return; } if (Object.values(S.pg).some(x => x.eroe === n) ) { toast('Esiste già un eroe con questo nome'); return; } if (S.uid) pgOpenDoc(S.uid, n); else toast('Accedi a Claude per creare la tua scheda'); return; }
  if (a === 'pgaddg') { const x = S.pg[t.dataset.k]; if (x && (S.pgOwner || S.pgOff) && !S.eroi.some(e => e.nome === x.eroe)) { S.eroi.push({nome: x.eroe, pe: 0}); saveGroup(); render(); toast(x.eroe + ' aggiunto al gruppo'); } return; }
  if (a === 'pgdelk') { if (!(S.pgOwner || S.pgOff)) return; if (t.dataset.ok !== '1') { t.dataset.ok = '1'; t.textContent = 'Conferma'; return; } const k = t.dataset.k; delete S.pg[k]; S.db && S.db.doc(PGC + '/' + k).delete().catch(e => console.error(e)); render(); return; }
  if (!d || !pgCanEd(id)) return;
  if (a === 'pgdelw') { d.armi.splice(Number(t.dataset.i), 1); }
  else if (a === 'pgdels') { const cl = t.dataset.cl; if (cl) { d.spellC = d.spellC || {}; d.spellC[cl] = pgSpells(d, cl).map(x => x.nome).filter(n => n !== t.dataset.n); } else d.spell = (d.spell || []).filter(n => n !== t.dataset.n); }
  else if (a === 'pgdelbk') { const cl = t.dataset.cl, n = t.dataset.n; if (d.libroBk && d.libroBk[cl]) d.libroBk[cl] = d.libroBk[cl].filter(b => b.n !== n); const pr = (d.libro || {})[cl]; if (pr) for (const k of Object.keys(pr)) pr[k] = (pr[k] || []).filter(x => x !== n); }
  else if (a === 'pgdelsp') { const l = ((d.libro || {})[t.dataset.cl] || {})[t.dataset.lv]; if (l) { const k = t.dataset.k != null ? Number(t.dataset.k) : l.indexOf(t.dataset.n); if (k >= 0 && l[k] === t.dataset.n) l.splice(k, 1); } }
  else if (a === 'pgdelt') { d.tal = (d.tal || []).filter(n => n !== t.dataset.n); }
  else if (a === 'pgrest') {

function sugg(q){
  const n = norm(q); if (!n) return [];
  const pre = [], mid = [];
  for (const b of B) { const a = norm(b.nome), e = norm(b.en); if (a.startsWith(n) || e.startsWith(n)) pre.push(b); else if (a.includes(n) || e.includes(n)) mid.push(b); }
  return [...pre.sort((x,y)=>x.nome.length-y.nome.length), ...mid].slice(0, 6);
}

  else if (a==='addh'){ S.eroi.push({nome:'Eroe '+(S.eroi.length+1), pe:0}); saveGroup(); render(); }
  else if (a==='delh'){ S.eroi.splice(Number(b.dataset.i),1); saveGroup(); render(); }
  else if (a==='addpe'){ const n = Number(String($('#addpe').value).replace(/\./g,'')); if (!n) return; S.eroi.forEach(x => x.pe = (Number(x.pe)||0) + n); $('#addpe').value=''; saveGroup(); render(); toast(`${n} PE a ogni eroe`); }
  else if (a==='rand'){ const {a:lo, b:hi} = neededPE(S.gen.diff, S.gen.n); const l = poolOf(S.gen.tipo).filter(x => x.pe >= lo && x.pe <= hi); if (l.length) { S.pick = l[Math.floor(Math.random()*l.length)].id; render(); } }
  else if (a==='setn'){ S.gen.n = Number(b.dataset.n); S.pick = null; render(); }
  else if (a==='spsort'){ S.spSort = b.dataset.s; render(); }
  else if (a==='sort'){ S.sort = b.dataset.s; render(); }
  else if (a==='bulksave'){ if (!S.saving) bulkSave(); }
  else if (a==='bulkclear'){ S.bulk = null; S.fast = null; render(); }
  else if (a==='faston'){ const k = S.bulk.findIndex(x => x.id == null); S.fast = k < 0 ? 0 : k; S.sel = 0; render(); const f = $('#fastin'); if (f) { f.value=''; f.focus(); } }
  else if (a==='fastoff'){ S.fast = null; render(); }
  else if (a==='fastmove'){ const d = Number(b.dataset.d); if (d < 0) { S.fast = Math.max(0, S.fast-1); S.sel = 0; render(); const f = $('#fastin'); if (f) { f.value=''; f.focus(); } } else { S.fast = Math.min(S.bulk.length-1, S.fast+1); S.sel = 0; render(); const f = $('#fastin'); if (f) { f.value=''; f.focus(); } } }
  else if (a==='fastclear'){ S.bulk[S.fast].id = null; render(); }
  else if (a==='fastpick'){ fastPick(Number(b.dataset.id)); }
  else if (a==='bulkskip'){ S.bulk[Number(b.dataset.i)].id = null; render(); }
  else if (a==='delimg'){ if (b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Conferma'; return; } S.imgs['m'+b.dataset.id] = ''; save('e5immagini/m'+b.dataset.id, null); render(); toast('Immagine rimossa'); }
  else if (a==='mode'){ S.gen.mode = b.dataset.m; render(); }
  else if (a==='mix'){ makeMix(); render(); }
  else if (a==='addmix'){ addVoci(S.mix[Number(b.dataset.k)]); }
  else if (a==='tab'){ makeTab(); render(); }
  else if (a==='roll'){ S.roll = 1 + Math.floor(Math.random()*8); render(); }
  else if (a==='addtab'){ addVoci(S.tab[Number(b.dataset.k)].voci); }
  else if (a==='scheda'){ openSheet(Number(b.dataset.id)); }
  else if (a==='close'){ closeSheet(); }
});
document.addEventListener('input', e => {

  if ((t.dataset.h != null || t.dataset.i) && !ED()) return;
  if (t.dataset.h != null){ const v = t.dataset.k==='pe' ? String(t.value).replace(/\D/g,'') : t.value; S.eroi[t.dataset.h][t.dataset.k] = t.dataset.k==='pe' ? Number(v||0) : v; saveGroup(); clearTimeout(S.rt); S.rt = setTimeout(render, 500); return; }
  if (t.dataset.b){ S[t.dataset.b] = t.value; clearTimeout(S.rt); S.rt = setTimeout(render, 250); return; }

});
document.addEventListener('change', e => {
  const t = e.target;
  if ((t.dataset.stato || t.dataset.up || t.dataset.bulkin != null || t.dataset.bk != null) && !ED()) return;
  if (t.dataset.up && t.files && t.files[0]) { upload(Number(t.dataset.up), t.files[0]); return; }
  if (t.dataset.bulkin != null && t.files && t.files.length) { bulkAdd([...t.files]); t.value = ''; return; }
  if (t.dataset.bk != null) { const x = S.bulk[Number(t.dataset.bk)], v = t.value.trim().toLowerCase(), f = B.find(b => b.nome.toLowerCase() === v || b.en.toLowerCase() === v); x.id = f ? f.id : null; render(); return; }
  if (t.dataset.g){ const k = t.dataset.g; S.gen[k] = k==='n' ? Number(t.value) : t.type==='checkbox' ? t.checked : t.value; S.pick = null; if (k==='zona') { S.tab = null; S.mix = null; } render(); }
  if (t.dataset.b){ S[t.dataset.b] = t.value; render(); }
  if (t.dataset.stato){ const id = t.dataset.stato; S.saved[id] = {...S.saved[id], stato:t.value}; save('e5incontri/'+id, S.saved[id]); }
});
function route(){
  const h = location.hash.slice(1), m = /^m-(\d+)$/.exec(h), sm = /^s-(\d+)$/.exec(h), pm = /^pg-(.+)$/.exec(h);
  document.body.classList.toggle('wide', h === 'spellbook' || !!sm || h === 'pg' || !!pm);
  if (pm) { S.view = 'pgscheda'; S.pgId = decodeURIComponent(pm[1]); render(); window.scrollTo(0,0); return; }
  if (sm) { S.view = 'incantesimo'; S.sid = Number(sm[1]); render(); window.scrollTo(0,0); return; }
  if (m && B[Number(m[1])]) { S.view = 'mostro'; S.mid = Number(m[1]); loadImg(S.mid); render(); window.scrollTo(0,0); return; }
  S.view = ['gruppo','generatore','bestiario','incontri','immagini','spellbook','pg'].includes(h) ? h : 'gruppo'; render();
}
window.addEventListener('hashchange', route);
async function sha(s){ const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2,'0')).join(''); }
function openLogin(){
  $('#sheet').innerHTML = `<form id="mform"><div class="row" style="justify-content:space-between;align-items:start"><h2 id="sh-t" style="margin:0">Modalità Master</h2><button type="button" class="sm" data-act="close" aria-label="Chiudi">✕</button></div>
  <p class="muted">Inserisci la password per modificare gruppo, incontri e immagini.</p>
  <label for="mpw">Password</label><input id="mpw" type="password" autocomplete="current-password" required>
  <p class="pwerr" id="pwerr" aria-live="polite"></p>
  <div class="row"><button class="pri" type="submit">Entra</button><button type="button" data-act="close">Annulla</button></div></form>`;
  S.back = document.activeElement; $('#veil').hidden = false; $('#mpw').focus();
}
document.addEventListener('submit', async e => {
  if (e.target.id === 'schform') {
    e.preventDefault(); if (!ED()) return;
    const id = Number(e.target.dataset.id), fd = new FormData(e.target), o = {nome: B[id].nome};
    for (const k of SK) o[k] = String(fd.get(k) || '').trim();
    S.schede = S.schede || {}; S.schede['m'+id] = o; S.edsch = null;
    save('e5schede/m'+id, o); render(); toast('Scheda salvata'); return;
  }
  if (e.target.id !== 'mform') return;
  e.preventDefault();
  let ok = false;
  try { ok = (await sha($('#mpw').value)) === MHASH; } catch (err) { console.error(err); }
  if (!ok) { $('#pwerr').textContent = 'Password errata.'; $('#mpw').select(); return; }
  S.master = true; try { sessionStorage.setItem(KEY+'-master', '1'); } catch(_) {}
  closeSheet(); render();
  toast(S.canWrite ? 'Modalità Master attiva' : 'Password giusta, ma il tuo account non può modificare questa pagina');
});

async function shrink(file, max = 560){
  const url = URL.createObjectURL(file), im = new Image();
  try {
    await new Promise((ok, ko) => { im.onload = ok; im.onerror = ko; im.src = url; });
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    let q = 0.8, src = c.toDataURL('image/jpeg', q);
    while (src.length > 300000 && q > 0.4) { q -= 0.12; src = c.toDataURL('image/jpeg', q); }
    return src;
  } finally { URL.revokeObjectURL(url); }
}
async function upload(id, file){
  if (!file.type.startsWith('image/')) { toast('Scegli un file immagine'); return; }
  try {
    const src = await shrink(file);
    S.imgs['m'+id] = src; save('e5immagini/m'+id, {src, nome: B[id].nome}); render();
    toast(S.db ? 'Immagine salvata' : 'Immagine visibile solo in questa pagina');
  } catch (err) { console.error(err); toast('Immagine non leggibile'); }
}
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\.[a-z0-9]{2,5}$/,'').replace(/[^a-z0-9]+/g,' ').trim();
const NAMES = B.flatMap(b => [[norm(b.nome), b.id], [norm(b.en), b.id]]).sort((a, c) => c[0].length - a[0].length);
function guess(fn){
  const n = norm(fn.split('/').pop()), ex = NAMES.find(([k]) => k === n);
  if (ex) return ex[1];
  const sg = SUGG.find(s => { const k = norm(s.file); return n === k || n.includes(k); });
  if (sg) return sg.id;
  const c = NAMES.find(([k]) => k.length > 3 && (' ' + n + ' ').includes(' ' + k + ' '));
  return c ? c[1] : null;
}
const IMG_EXT = /\.(jpe?g|png|webp|gif|bmp)$/i;
let zipLib = null;
function loadZipLib(){
  return zipLib || (zipLib = new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload = () => ok(window.JSZip); s.onerror = ko; document.head.appendChild(s); }));
}
function bulkMsg(m){ const el = $('#bulkst'); if (el) el.textContent = m; }
async function bulkAdd(list){
  let files = [];
  for (const f of list) {
    if (/\.zip$/i.test(f.name)) {
      try {
        bulkMsg('Apro ' + f.name + '…');
        const Z = await loadZipLib(), z = await Z.loadAsync(f);
        for (const e of Object.values(z.files)) if (!e.dir && IMG_EXT.test(e.name) && !e.name.includes('__MACOSX')) {
          const blob = await e.async('blob'), ext = e.name.split('.').pop().toLowerCase();
          files.push(new File([blob], e.name.split('/').pop(), {type: 'image/' + (ext === 'jpg' ? 'jpeg' : ext)}));
        }
      } catch (err) { console.error(err); toast('Non riesco ad aprire ' + f.name); }
    } else if (f.type.startsWith('image/') || IMG_EXT.test(f.name)) files.push(f);
  }
  if (!files.length) { bulkMsg('Nessuna immagine trovata.'); return; }
  S.bulk = S.bulk || [];
  for (let i = 0; i < files.length; i++) {
    bulkMsg(`Preparo ${i+1} di ${files.length}…`);
    try { S.bulk.push({name: files[i].name, src: await shrink(files[i]), id: guess(files[i].name)}); } catch (err) { console.error(err); }
  }
  render();
}
async function bulkSave(){
  const todo = (S.bulk || []).filter(x => x.id != null);
  if (!todo.length) return;
  S.saving = true;
  for (let i = 0; i < todo.length; i++) {
    const x = todo[i];
    bulkMsg(`Salvo ${i+1} di ${todo.length}…`);
    S.imgs['m' + x.id] = x.src;
    if (S.db && S.canWrite) {
      try { await S.db.doc('e5immagini/m' + x.id).set({src: x.src, nome: B[x.id].nome}); x.done = true; }
      catch (err) { console.error(err); x.err = true; if (err && err.code === 'invalid_argument') { S.canWrite = false; break; } }
    } else x.done = true;
  }
  const ok = todo.filter(x => x.done).length, ko = todo.filter(x => x.err).length;
  S.bulk = S.bulk.filter(x => !x.done); S.saving = false; render();
  toast(ko ? `${ok} salvate, ${ko} non riuscite` : `${ok} immagini salvate`);
}
function loadImg(id){
  const k = 'm' + id;
  if (!S.db || k in S.imgs) return;
  S.imgs[k] = null;
  S.db.doc('e5immagini/' + k).get().then(s => { const x = s.exists ? s.data() : null; S.imgs[k] = x && typeof x.src === 'string' && x.src.startsWith('data:image/') ? x.src : ''; if (S.view === 'mostro' && S.mid === id) render(); }).catch(e => { console.error(e); S.imgs[k] = ''; });
}
document.addEventListener('dragover', e => { const p = e.target.closest && e.target.closest('#pic'); if (p && S.canWrite) { e.preventDefault(); p.classList.add('drop'); } });
document.addEventListener('dragleave', e => { const p = e.target.closest && e.target.closest('#pic'); if (p) p.classList.remove('drop'); });
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('#bulkdrop'); if (z) { e.preventDefault(); z.classList.add('drop'); } });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('#bulkdrop'); if (z) { e.preventDefault(); z.classList.remove('drop'); if (ED()) bulkAdd([...e.dataTransfer.files]); } });
document.addEventListener('drop', e => { const p = e.target.closest && e.target.closest('#pic'); if (!p || !S.canWrite) return; e.preventDefault(); p.classList.remove('drop'); const f = e.dataTransfer.files[0]; if (f && ED()) upload(Number(p.dataset.id), f); });
$('#veil').addEventListener('click', e => { if (e.target.id === 'veil') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#veil').hidden) closeSheet(); });
route();
fetch('mostri5.json', {cache: 'no-cache'}).then(r => r.json()).then(d => { ST = d; render(); }).catch(e => { console.error(e); toast('Schede non caricate'); });
(async () => {
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db) return;
    S.db = db; S.canWrite = !!(user && (user.isOwner() || user.canEdit()));
    db.doc('e5stato/gruppo').onSnapshot(s => { if (s.exists && s.data().eroi && !s.metadata.hasPendingWrites) { S.eroi = JSON.parse(JSON.stringify(s.data().eroi)); render(); } }, e => console.error(e));
    if (S.view === 'mostro') loadImg(S.mid);
    db.collection('e5schede').onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.schede = o; render(); }, e => console.error(e));
    db.collection('e5incontri').onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.saved = o; render(); }, e => console.error(e));
  } catch(e) { console.error(e); }
})();
}
