<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il Primo Verso · Giornale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya:ital@0;1&display=swap" rel="stylesheet">
<style>
/* VOICE: un giornale di campagna, intimo e d'epoca, scritto dal Master a lume di candela.
   IDEA: il quaderno rilegato del Master, con le mappe incollate e i sigilli di cera su ciò che è segreto.
   PICTURE: le mappe stesse del regno e delle città, grandi, con i segnalini cliccabili.
   COLOUR and TYPE: pergamena calda, inchiostro bruno, bronzo delle campane, cera rossa per il segreto; Cinzel + EB Garamond.
   LAYOUT: barra in alto con le sezioni; mappa grande a sinistra, scheda del luogo a destra; colonna unica sul telefono. */
:root{color-scheme:light dark;
--bg:light-dark(#ece7de,#171513);--page:light-dark(#fbf8f2,#221f1b);--ink:light-dark(#221d17,#ece4d6);--soft:light-dark(#6c6355,#a99f8f);
--bronzo:light-dark(#c4521f,#f08a4b);--cera:light-dark(#b3261e,#f08a7b);--rule:light-dark(#d6cdbd,#3a342c);--chip:light-dark(#e6dfd2,#2c2823);--ottone:light-dark(#9a7426,#d9b25a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Alegreya Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Alegreya SC",Georgia,serif;line-height:1.1;text-wrap:balance;margin:0 0 .4em}
h2{font-size:clamp(24px,3vw,32px)}h3{font-size:19px}
a{color:var(--bronzo)}
button,select,input,textarea{font:inherit;color:inherit}
button{min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--rule);background:var(--page);cursor:pointer}
button:hover{border-color:var(--bronzo)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--bronzo);outline-offset:2px}
button.pri{background:var(--bronzo);color:#fff8ea;border-color:var(--bronzo)}
button.wax{background:var(--cera);color:#fff3ea;border-color:var(--cera)}
input,textarea,select{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:6px;background:var(--page)}
textarea{min-height:110px;resize:vertical}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--bronzo);padding:10px max(3vw,14px);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header.top h1{font-size:22px;margin:0;color:var(--bronzo)}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
nav a{padding:10px 14px;border-radius:6px;text-decoration:none;color:var(--ink);font-family:"Alegreya SC",Georgia,serif;font-size:15px}
nav a.on{background:var(--chip);color:var(--bronzo)}
.role{font-size:14px;color:var(--soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.role b{color:var(--cera)}
main{max-width:1320px;margin:0 auto;padding:20px max(3vw,14px) 60px}
.note{background:var(--page);border:1px solid var(--rule);border-left:4px solid var(--bronzo);padding:12px 16px;border-radius:6px;margin:0 0 16px}
.secret{border-left-color:var(--cera)}
.muted{color:var(--soft)}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.mapwrap{position:relative;border:3px solid var(--bronzo);border-radius:4px;overflow:auto;background:#d9c79c;max-height:78vh}
.mapin{position:relative;width:100%}
.mapin img{display:block;width:100%;height:auto;user-select:none}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;min-height:0;padding:0;border-radius:50%;border:2px solid #2e2014;font:700 13px/1 "Alegreya Sans",sans-serif;color:#2e2014;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.pin.off{opacity:.55;border-style:dashed}
.pin.sel{outline:3px solid var(--cera);outline-offset:2px}
.cpin{position:absolute;transform:translate(-50%,-50%);min-height:0;padding:6px 12px;border-radius:999px;border:2px solid #2e2014;background:#f4e7c6;color:#2e2014;font:600 15px/1.1 "Alegreya SC",Georgia,serif;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.cpin.min{font:italic 600 14px/1.1 "Alegreya Sans",sans-serif;background:#efe1c0}
.cpin.off{opacity:.6;border-style:dashed}
.dot{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;min-height:0;padding:0;border-radius:50%;border:2px solid #2e2014;background:#8b2a1d;box-shadow:0 0 0 3px #f4e7c6}
.dot.min{background:#f4e7c6;box-shadow:0 0 0 2px #2e2014;width:12px;height:12px}
.dot.off{opacity:.55}
.lbl{position:absolute;left:0;top:0;transform:none;visibility:hidden}
.lbl.cpin{transform:none}
.plbl{min-height:0;padding:3px 8px;border-radius:5px;border:1px solid #2e2014;background:rgba(246,236,210,.94);color:#2e2014;font:600 13px/1.15 "Alegreya Sans",sans-serif;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.ritr{display:block;width:100%;max-width:260px;aspect-ratio:3/4;object-fit:cover;border:3px solid var(--bronzo);border-radius:6px;margin:8px 0;background:var(--chip)}
.ritr.sm{width:72px;max-width:72px;float:left;margin:2px 12px 6px 0}
.upl{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px dashed var(--bronzo);border-radius:6px;cursor:pointer}
.upl input{position:absolute;opacity:0;width:1px;height:1px}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.hero{background:var(--page);border:1px solid var(--rule);border-top:4px solid var(--bronzo);border-radius:8px;padding:12px 14px}
.hero h3{margin:0 0 4px}.bar.pe i{background:var(--bronzo)}.bar.hp i{background:#5d8a4e}.bar.hp.mid i{background:#c39a2b}.bar.hp.low i{background:var(--cera)}.hero .lv{font-size:1.5em;font-family:inherit;font-weight:700;float:right;color:var(--bronzo)}.hero .hpctl{display:flex;gap:6px;margin-top:8px}.hero .hpctl input{width:70px}.hero .hpctl button{flex:1}.chk{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0}.chk label{display:flex;gap:6px;align-items:center;font-weight:400}.chk input{width:auto}.bar{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--cera)}
.item{padding:10px 0;border-bottom:1px dotted var(--rule)}.item .meta{font-size:14px;color:var(--soft)}
.reply{margin-top:6px;padding:8px 12px;border-left:3px solid var(--bronzo);background:var(--chip);border-radius:4px}
.report{max-width:860px}.report h3{margin-top:1em}
.badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:999px;background:var(--cera);color:#fff;font-size:13px;text-align:center;margin-left:4px}
.c-L{background:#d6a848}.c-T{background:#96b6cc}.c-G{background:#92b270}.c-P{background:#c86048;color:#fff}.c-S{background:#f2e6c8}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:36px;padding:0 10px;font-size:15px}
.chips button.on{background:var(--chip);border-color:var(--bronzo)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid #2e2014;vertical-align:middle;margin-right:6px}
.card{background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.card h3{color:var(--bronzo)}
.panel{position:sticky;top:84px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--rule);cursor:pointer}
.list li:hover{color:var(--bronzo)}
.tag{font-size:13px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--soft);white-space:nowrap}
.tag.vis{background:#3f6b3a;color:#f2fbe9}.tag.hid{background:var(--cera);color:#fff3ea}
.dm{border:1px dashed var(--cera);border-radius:8px;padding:12px;margin-top:12px;background:light-dark(#f8ece4,#2b1c18)}
.dm h4{margin:0 0 6px;font-family:"Alegreya SC",Georgia,serif;color:var(--cera);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin:14px 0}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none}
.tabs button.on{border-bottom-color:var(--bronzo);color:var(--bronzo)}
.prose table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
.prose th,.prose td{border-bottom:1px solid var(--rule);padding:6px;text-align:left;vertical-align:top}
.prose blockquote,.read{margin:10px 0;padding:10px 14px;border-left:3px solid var(--bronzo);background:var(--chip);font-style:italic}
.entry{background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:18px 22px;margin-bottom:18px;max-width:820px}
.entry .meta{font-size:14px;color:var(--soft);margin-bottom:6px}
.entry h3{font-size:22px}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media(max-width:600px){.cols2{grid-template-columns:minmax(0,1fr)}.pin{width:24px;height:24px;font-size:11px}.cpin{font-size:11px;padding:2px 6px;border-width:1px}.plbl{font-size:11px;padding:2px 5px}header.top h1{font-size:18px;flex:1}nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto}nav a{padding:8px 10px;font-size:14px;flex:none}.role button{min-height:36px;padding:0 10px;font-size:14px}}
.empty{padding:40px 10px;text-align:center;color:var(--soft)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
header.top .rosa{width:40px;height:40px;flex:0 0 auto}
header.top{border-bottom-color:var(--brace,var(--bronzo))}
header.top h1{color:var(--ink);font-size:clamp(22px,2.8vw,28px)}
button,input,textarea,select,.note,.card{border-radius:9px}
button{font-weight:500}
button.pri{font-weight:700;color:#fff6ee}
nav a{border-radius:999px;font-family:"Alegreya Sans",system-ui,sans-serif;font-weight:500;font-size:16px}
nav a.on{background:var(--bronzo);color:#fff6ee;font-weight:700}
header.top{gap:8px 14px}header.top nav{order:9;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}header.top nav a{white-space:nowrap}
header.top .role{margin-left:auto}
.pvio label,.role button{background:var(--page);color:var(--ink);font-weight:500}
.prose,.testo,blockquote{font-family:"Alegreya",Georgia,serif;font-size:18px;line-height:1.65}
.mapwrap{border-color:var(--ottone);border-radius:9px}
.ritr{border-color:var(--ottone)}
.pref h3{font-family:"Alegreya SC",Georgia,serif;font-size:22px;margin:1.2em 0 .4em;color:var(--bronzo)}.pref blockquote{border-left:3px solid var(--ottone);margin:0 0 1em;padding:6px 14px;font-style:italic;color:var(--soft)}.pref ul{padding-left:1.2em}.pref li{margin:.3em 0}
.tavback{min-height:38px;padding:0 12px;font-size:15px}.pvio{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pvio label{cursor:pointer}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <svg class="rosa" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(50 50)">
    <circle r="44" fill="none" style="stroke:var(--ottone)" stroke-width="2.5"/><circle r="36" fill="none" style="stroke:var(--ottone)" stroke-width="1" opacity=".6"/>
    <g style="fill:var(--ottone)" opacity=".55"><path d="M0-30 4-4 30 0 4 4 0 30-4 4-30 0-4-4Z" transform="rotate(45)"/></g>
    <path d="M0-42 6-6 0 0Z" style="fill:var(--bronzo)"/><path d="M0-42-6-6 0 0Z" style="fill:light-dark(#8f3a14,#b8602f)"/>
    <path d="M0 42 6 6 0 0Z" style="fill:var(--ottone)"/><path d="M0 42-6 6 0 0Z" style="fill:light-dark(#6e531a,#a8873f)"/>
    <path d="M42 0 6 6 0 0Z" style="fill:var(--ottone)"/><path d="M42 0 6-6 0 0Z" style="fill:light-dark(#6e531a,#a8873f)"/>
    <path d="M-42 0-6 6 0 0Z" style="fill:var(--ottone)"/><path d="M-42 0-6-6 0 0Z" style="fill:light-dark(#6e531a,#a8873f)"/>
    <circle r="4" style="fill:var(--page);stroke:var(--ottone)" stroke-width="2"/></g></svg>
  <h1>Il Primo Verso</h1>
  <nav id="nav">
    <a href="#prefazione" data-v="prefazione">Prefazione</a>
    <a href="#diario" data-v="diario">Diario</a>
    <a href="#atlante" data-v="atlante">Atlante</a>
    <a href="#missioni" data-v="missioni">Missioni</a>
    <a href="#taccuino" data-v="taccuino">Taccuino</a>
    <a href="#gruppo" data-v="gruppo">Il gruppo</a>
    <a href="#custode" data-v="custode" id="navc" hidden>Custode</a>
    <a href="#scontri" data-v="scontri" id="navs" hidden>Scontri</a>
  </nav>
  <div class="role" id="role">Caricamento…</div><button type="button" id="tavback" class="tavback">← Diario della missione</button>
</header>
<main id="main"><div class="empty">Apro il giornale…</div></main>
<div class="toast" id="toast"></div>
<script>
{
const $ = s => document.querySelector(s);
const CATS = {L:'Locande e taverne',T:'Templi e santuari',G:'Gilde, botteghe e mercati',P:'Potere e guardia',S:'Luoghi della saga e altri'};
const MW = 2000, MH = 1533;
const S = {img:{},sc:{},arsIdx:null,arsCache:{},runSc:false,liveSc:'',autoSc:false,grp:{},teo:{},dia:{},az:{},cus:{},subs:{},me:null,canWrite:true,run:false,live:'',auto:false,names:true,assets:null,db:null,user:null,isDM:false,asPlayer:false,master:{},pub:{},dm:{},dp:{},view:'prefazione',testi:{},prefEdit:false,city:null,sel:null,cat:'',zoom:1,ctab:'luoghi',minor:null,edit:null,loaded:false,err:''};

const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip = h => { const d = new DOMParser().parseFromString('<div>'+(h||'')+'</div>','text/html'); return d.body.textContent.trim(); };
function md(t){ // markdown minimo e sicuro per i testi scritti nel giornale
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
  const out=[]; let list=null;
  for (const raw of String(t||'').split(/\n/)){
    const l=raw.trimEnd();
    if (/^\s*[-*] /.test(l)){ if(!list){list=[];} list.push('<li>'+inl(l.replace(/^\s*[-*] /,''))+'</li>'); continue; }
    if (list){ out.push('<ul>'+list.join('')+'</ul>'); list=null; }
    if (!l.trim()) { out.push(''); continue; }
    if (/^### /.test(l)) out.push('<h4>'+inl(l.slice(4))+'</h4>');
    else if (/^## /.test(l)) out.push('<h3>'+inl(l.slice(3))+'</h3>');
    else if (/^# /.test(l)) out.push('<h3>'+inl(l.slice(2))+'</h3>');
    else if (/^> /.test(l)) out.push('<blockquote>'+inl(l.slice(2))+'</blockquote>');
    else out.push('<p>'+inl(l)+'</p>');
  }
  if (list) out.push('<ul>'+list.join('')+'</ul>');
  return out.join('');
}
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.k); toast.k=setTimeout(()=>t.classList.remove('on'),2200); }
const dmOn = () => S.isDM && !S.asPlayer;

// ---------- scritture: una alla volta per documento
const queues = {};
function write(path, fn){
  const q = (queues[path] || Promise.resolve()).then(fn).catch(e => { console.error(e); toast(e && e.code==='quota_exceeded' ? 'Spazio esaurito nel giornale' : 'Non sono riuscito a salvare. Riprova.'); });
  queues[path] = q; return q;
}
function pubDoc(id){ return JSON.parse(JSON.stringify(S.pub[id] || {})); }
function savePub(id, obj){ S.pub[id] = obj; render(); return write('pubblico/'+id, () => S.db.doc('pubblico/'+id).set(obj)); }


// ---------- Tavolo del Master: database con prefisso, ritratti salvati come immagini nel database
const pvDb = d => ({ doc: p => d.doc('pv_' + p), collection: c => d.collection('pv_' + c) });
const pvMap = p => (window.PV_MAPS && window.PV_MAPS[p]) || p;
const imgSrc = id => !id ? '' : String(id).startsWith('img:') ? ((S.img || {})[String(id).slice(4)] || {}).d || '' : '/_blob/' + id;
async function pvShrink(file){
  const bmp = await createImageBitmap(file);
  let max = 520, q = .82, out = '';
  for (let i = 0; i < 6; i++) {
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', q); if (out.length < 150000) break; q -= .1; max = Math.round(max * .8);
  }
  return out;
}
document.addEventListener('click', e => { if (e.target.closest('#tavback')) { try { sessionStorage.setItem('tavolo-ed', 'diario'); } catch(_) {} location.hash = ''; location.reload(); } });
// esporta / importa tutti i dati del giornale (solo il Master)
function pvExport(){
  const docs = {};
  const put = (c, o) => { for (const [k, v] of Object.entries(o || {})) docs[c + '/' + k] = v; };
  put('master', S.master); put('pubblico', S.pub); put('diario_m', S.dm); put('diario_p', S.dp); put('gruppo', S.grp); put('img', S.img); put('testi', S.testi);
  for (const [u, o] of Object.entries(S.teo || {})) put(`gruppo/${u}/teorie`, o);
  for (const [u, o] of Object.entries(S.dia || {})) put(`gruppo/${u}/diario`, o);
  for (const [u, o] of Object.entries(S.az || {})) put(`riservate/${u}/azioni`, o);
  const blob = new Blob([JSON.stringify({giornale: 'il-primo-verso', data: new Date().toISOString(), docs})], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'giornale-il-primo-verso-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast('Giornale esportato');
}
async function pvImport(file, msg){
  try {
    const j = JSON.parse(await file.text()); if (!j || !j.docs || typeof j.docs !== 'object') throw new Error('formato');
    const ks = Object.keys(j.docs).filter(k => !/^(custode|scontri|arsenale)\//.test(k));
    let i = 0; for (const k of ks) { i++; if (msg) msg.textContent = `Importo ${i}/${ks.length}…`; await S.db.doc(k).set(j.docs[k]); }
    if (msg) msg.textContent = 'Fatto.'; toast('Giornale importato: ' + ks.length + ' elementi');
  } catch (e) { console.error(e); if (msg) msg.textContent = 'File non valido o non salvato: usa un file esportato dal Giornale.'; toast('Importazione non riuscita'); }
}
document.addEventListener('change', e => { if ((e.target.id === 'pvimp' || e.target.id === 'pvimph') && e.target.files[0]) { const f = e.target.files[0]; e.target.value = ''; pvImport(f, document.getElementById('impmsg') || document.getElementById('pvmsg')); } });
document.addEventListener('click', e => { if (e.target.closest('#pvexp')) pvExport(); });


// ---------- PREFAZIONE
const PREF_BASE = "Le campane di Thessarim suonano da più di trecento anni. Suonano all'alba e al tramonto, suonano quando nasce un bambino e quando muore un vecchio, suonano quando dalle paludi oltre il Muro sale la nebbia. Finché suonano, dicono i Campanari, nessuno può essere dimenticato.\n\nNella nebbia, il Grigiore, non si muore. Si sparisce. Chi ci resta troppo a lungo torna a casa e trova la porta chiusa, perché nessuno lo aspetta più. I figli non ricordano la madre, il mercante non ricorda il socio, la moglie non ricorda di essersi sposata. Nel registro della parrocchia resta una riga bianca dove c'era un nome.\n\nPer questo ogni neonato del regno viene portato sotto la campana, e il Campanaro canta il suo nome nel bronzo. Da quel giorno il bambino è intonato, e la campana lo protegge.\n\nQuasi ogni bambino.\n\nCi sono persone a cui la campana non ha mai risposto. Il prete ha cantato il loro nome, una volta, due, tre, e il bronzo è rimasto muto. Non possono possedere terre, né testimoniare in tribunale, né sposarsi nei templi. La gente le chiama Senzaeco, e non sempre con gentilezza.\n\nQuattro di loro, quest'anno, si trovano a Pieve di Rovo, un villaggio di colline e vigne basse a due giorni dal Muro. Non si conoscono bene. Non sanno di avere qualcosa in comune.\n\nDomani è la Festa delle Intonazioni. Ci saranno lanterne di carta, pane dolce con l'uvetta, i dolcetti alle noci della vedova Ines e tre famiglie sotto il campanile con i neonati in braccio. Padre Aldo tirerà la corda, come ogni anno.\n\nAl secondo rintocco, la campana si spaccherà.\n\nE quella notte, mentre la nebbia scende dalle colline, quattro persone che il mondo non ha mai voluto ricordare scopriranno di essere le uniche capaci di ricordare tutto.";
function prefView(){
  const dm = dmOn(), mio = (S.testi.prefazione||{}).testo, t = mio || PREF_BASE;
  if (dm && S.prefEdit) return `<h2>Prefazione</h2><div class="card"><p class="muted" style="margin-top:0">La leggono tutti i giocatori. Si può usare **grassetto**, *corsivo*, ## titoli, - elenchi e > citazioni.</p>
    <label for="pref-t">Testo della prefazione</label><textarea id="pref-t" rows="24">${esc(t)}</textarea>
    <div class="row"><button class="pri" type="button" id="prefsave">Salva</button><button type="button" id="prefcanc">Annulla</button>${mio?'<button type="button" id="prefreset" style="margin-left:auto">Torna al testo originale</button>':''}</div></div>`;
  return `<div class="row" style="justify-content:space-between;align-items:center;max-width:820px"><h2 style="margin:0">Prefazione</h2>${dm?'<button type="button" id="prefed">✎ Modifica</button>':''}</div>
    <article class="card prose pref" style="max-width:820px;margin-top:12px">${md(t)}</article>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('#prefed,#prefsave,#prefcanc,#prefreset'); if (!t || !dmOn()) return;
  if (t.id === 'prefed') { S.prefEdit = true; render(); setTimeout(() => { const x = document.getElementById('pref-t'); if (x) x.focus(); }, 0); }
  else if (t.id === 'prefcanc') { S.prefEdit = false; const ta = document.getElementById('pref-t'); if (ta) ta.value = ta.defaultValue; render(); }
  else if (t.id === 'prefsave') { const v = document.getElementById('pref-t').value.trim(); S.testi.prefazione = {testo: v}; S.prefEdit = false; S.clearForm = true; const ta = document.getElementById('pref-t'); if (ta) ta.defaultValue = ta.value; render(); write('testi/prefazione', () => S.db.doc('testi/prefazione').set({testo: v})).then(() => toast('Prefazione salvata')); }
  else if (t.id === 'prefreset') { delete S.testi.prefazione; S.prefEdit = false; render(); write('testi/prefazione', () => S.db.doc('testi/prefazione').delete()).then(() => toast('Testo originale ripristinato')); }
});

function render(){
  for (const a of document.querySelectorAll('#nav a')) a.classList.toggle('on', a.dataset.v === S.view);
  $('#navc').hidden = true; $('#navs').hidden = true;
  const r = $('#role');
  if (!S.db) { r.textContent = ''; }
  else if (S.isDM) r.innerHTML = `<span>${S.asPlayer?'Vista dei giocatori':'<b>Master</b>'}</span><button id="asp">${S.asPlayer?'Torna Master':'Vedi come giocatore'}</button>${S.asPlayer?'':'<span class="pvio"><button id="pvexp" type="button">Esporta</button><label class="btnl" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--rule);border-radius:6px">Importa<input type="file" id="pvimph" accept=".json,application/json" hidden></label></span>'}`;
  else r.innerHTML = '<span>Giocatore</span>';
  const m = $('#main');
  if (S.err) { m.innerHTML = `<div class="empty">${esc(S.err)}</div>`; return; }
  if (!S.loaded) { m.innerHTML = '<div class="empty">Apro il giornale…</div>'; return; }
  if (S.isDM && !regno() && !S.asPlayer) { m.innerHTML = importView(); return; }
  const keep = {}, act = document.activeElement && document.activeElement.id;
  for (const el of m.querySelectorAll('input[id],textarea[id],select[id]')) if (el.type!=='checkbox' && el.value !== el.defaultValue && !(S.clearForm && /^(e|h|s|xp|hp)-/.test(el.id))) keep[el.id] = el.value;
  m.innerHTML = S.view==='prefazione' ? prefView() : S.view==='atlante' ? atlasView() : S.view==='missioni' ? missionsView() : S.view==='taccuino' ? notebookView() : S.view==='gruppo' ? groupView() : diaryView();
  S.clearForm = false;
  for (const [id,v] of Object.entries(keep)) { const el = document.getElementById(id); if (el) el.value = v; }
  if (act) { const el = document.getElementById(act); if (el && el.focus) el.focus(); }
  requestAnimationFrame(layoutLabels);
}

// ---------- etichette senza sovrapposizioni
function layoutLabels(){
  const wrap = document.querySelector('.mapin'); if (!wrap) return;
  const W = wrap.clientWidth, H = wrap.clientHeight; if (!W || H < 40) return;
  const box = el => { const r = el.getBoundingClientRect(), o = wrap.getBoundingClientRect(); return {x:r.left-o.left, y:r.top-o.top, w:r.width, h:r.height}; };
  const dots = [...wrap.querySelectorAll('.pin,.dot')].map(box), labs = [];
  const over = (a, list) => list.some(b => a.x < b.x+b.w+2 && a.x+a.w+2 > b.x && a.y < b.y+b.h+2 && a.y+a.h+2 > b.y);
  const placed = labs;
  const labels = [...wrap.querySelectorAll('.lbl')].sort((a,b)=>(b.dataset.pri-a.dataset.pri)||(a.dataset.y-b.dataset.y));
  for (const el of labels){
    el.style.visibility = 'hidden'; el.style.left = '0px'; el.style.top = '0px';
    const w = el.offsetWidth, h = el.offsetHeight, px = el.dataset.x/MW*W, py = el.dataset.y/MH*H;
    let best = null, bestOv = 1e9;
    for (const g0 of [Number(el.dataset.g)||12]) for (const g of [g0, g0+14, g0+30]) {
      const k = g*.75;
      const cands = [[px+g,py-h/2],[px-g-w,py-h/2],[px-w/2,py-g-h],[px-w/2,py+g],[px+k,py-k-h],[px+k,py+k],[px-k-w,py-k-h],[px-k-w,py+k]];
      for (const [x,y] of cands){
        const r = {x,y,w,h};
        if (x < 2 || y < 2 || x+w > W-2 || y+h > H-2) continue;
        if (over(r, labs)) continue;
        if (!over(r, dots)) { best = r; bestOv = 0; break; }
        if (el.dataset.pri >= 2 && bestOv > 1) { best = r; bestOv = 1; }
      }
      if (bestOv === 0) break;
    }
    if (best) { el.style.left = best.x+'px'; el.style.top = best.y+'px'; el.style.visibility = 'visible'; labs.push(best); }
  }
}
window.addEventListener('resize', () => { clearTimeout(layoutLabels.t); layoutLabels.t = setTimeout(layoutLabels, 120); });
document.addEventListener('load', e => { if (e.target.tagName === 'IMG') layoutLabels(); }, true);

// ---------- DIARIO
function diaryView(){
  const dm = dmOn();
  const src = dm ? S.dm : S.dp;
  const ents = Object.entries(src).sort((a,b)=>(b[1].creato||0)-(a[1].creato||0));
  let h = `<h2>Il diario della campagna</h2>`;
  if (dm) h += editorHTML();
  if (!ents.length) h += `<div class="empty">${dm?'Ancora nessuna voce. Scrivi la prima qui sopra.':'Il Master non ha ancora scritto niente per voi.'}</div>`;
  for (const [id,e] of ents){
    h += `<article class="entry"><div class="meta">${e.sessione?'Sessione '+esc(e.sessione)+' · ':''}${esc(e.data||'')}${dm?` · <span class="tag ${e.pubblico?'vis':'hid'}">${e.pubblico?'visibile ai giocatori':'solo Master'}</span>`:''}</div>
      <h3>${esc(e.titolo||'Senza titolo')}</h3><div class="prose">${md(e.testo)}</div>
      ${dm && e.segreto ? `<div class="note secret"><b>Note segrete.</b> ${md(e.segreto)}</div>`:''}
      ${dm ? `<div class="row"><button data-act="ed" data-id="${id}">Modifica</button><button data-act="tog" data-id="${id}">${e.pubblico?'Nascondi ai giocatori':'Mostra ai giocatori'}</button><button data-act="del" data-id="${id}">Elimina</button></div>`:''}
    </article>`;
  }
  return h;
}
function editorHTML(){
  const e = S.edit ? (S.dm[S.edit]||{}) : {};
  return `<form class="card" id="ed" style="max-width:820px"><h3>${S.edit?'Modifica la voce':'Nuova voce'}</h3>
  <div class="cols2"><div><label for="e-t">Titolo</label><input id="e-t" value="${esc(e.titolo||'')}" required></div>
  <div class="cols2"><div><label for="e-s">Sessione</label><input id="e-s" value="${esc(e.sessione||'')}"></div><div><label for="e-d">Data nel gioco</label><input id="e-d" value="${esc(e.data||'')}" placeholder="12° giorno del calendario"></div></div></div>
  <label for="e-x">Testo (si può usare **grassetto**, *corsivo*, - elenchi, > citazioni)</label><textarea id="e-x" rows="7">${esc(e.testo||'')}</textarea>
  <label for="e-g">Note segrete (non le vedono mai i giocatori)</label><textarea id="e-g" rows="3">${esc(e.segreto||'')}</textarea>
  <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="e-p" style="width:auto" ${e.pubblico?'checked':''}> Visibile ai giocatori</label>
  <div class="row"><button class="pri" type="submit">Salva</button>${S.edit?'<button type="button" data-act="cancel">Annulla</button>':''}</div></form>`;
}
async function saveEntry(){
  const id = S.edit || ('v'+Date.now().toString(36));
  const old = S.dm[id] || {};
  const e = {titolo:$('#e-t').value.trim(),sessione:$('#e-s').value.trim(),data:$('#e-d').value.trim(),testo:$('#e-x').value,segreto:$('#e-g').value,pubblico:$('#e-p').checked,creato:old.creato||Date.now(),aggiornato:Date.now()};
  S.dm[id]=e; S.edit=null; S.clearForm=true; render();
  await write('diario_m/'+id, () => S.db.doc('diario_m/'+id).set(e));
  await syncPublic(id, e);
  toast('Voce salvata');
}
function syncPublic(id, e){
  if (e && e.pubblico){ const p={titolo:e.titolo,sessione:e.sessione,data:e.data,testo:e.testo,creato:e.creato}; return write('diario_p/'+id, ()=>S.db.doc('diario_p/'+id).set(p)); }
  return write('diario_p/'+id, ()=>S.db.doc('diario_p/'+id).delete());
}

function atlasView(){
  if (S.city) return cityView();
  const list = visibleCities();
  const dm = dmOn();
  let pins = list.map(c => {
    const on = !!(S.pub[c.min?'m_'+c.id:c.id]||{}).rivelata;
    const pos = `left:${c.x/MW*100}%;top:${c.y/MH*100}%`, act = `data-act="${c.min?'minor':'city'}" data-id="${esc(c.id)}"`;
    return `<button class="dot ${c.min?'min':''} ${dm&&!on?'off':''}" style="${pos}" ${act} aria-label="${esc(c.nome)}"></button><button class="lbl cpin ${c.min?'min':''} ${dm&&!on?'off':''}" data-x="${c.x}" data-y="${c.y}" data-g="10" data-pri="${c.min?1:2}" ${act}>${esc(c.nome)}</button>`;
  }).join('');
  let side = '';
  if (S.minor){
    const mi = (regno()?.minori||[]).find(x=>x.id===S.minor);
    const pub = S.pub['m_'+S.minor];
    side = `<div class="card"><h3>${esc(mi?mi.nome:(pub&&pub.nome)||'')}</h3>${dm&&mi?`<p>${mi.desc}</p>`:''}${pub&&pub.rivelata&&pub.testo?`<div class="prose">${md(pub.testo)}</div>`:''}
    ${dm&&mi?revealBox('m',mi.id,pub&&pub.rivelata,pub?pub.testo:strip(mi.desc),'Quello che i giocatori sanno di questo luogo'):''}</div>`;
  } else side = `<div class="card"><h3>Il Regno di Thessarim</h3><p>${dm?'Tocca una città per aprirne la mappa con tutti i luoghi, i PNG e le missioni. Quelle tratteggiate non sono ancora visibili ai giocatori: aprile e usa «Mostra ai giocatori».':'Tocca una città per aprirne la mappa. Qui compaiono solo i luoghi che avete scoperto.'}</p>
    ${!list.length?'<p class="muted">Nessun luogo ancora scoperto.</p>':''}</div>`;
  return `<div class="tools"><h2 style="margin:0">Atlante di Thessarim</h2><span style="flex:1"></span><button data-act="zoom">${S.zoom>1?'Riduci':'Ingrandisci'}</button></div><div class="grid"><div class="mapwrap"><div class="mapin" style="width:${S.zoom*100}%"><img src="${pvMap('maps/01_thessarim.jpg')}" alt="Mappa del regno di Thessarim">${pins}</div></div><div class="panel">${side}</div></div>`;

  return `<div class="dm"><h4>Per i giocatori</h4><span class="tag ${on?'vis':'hid'}">${on?'visibile':'nascosto'}</span>
  <label for="rv-${kind}" style="display:block;margin-top:8px">${label}. Controlla che non ci siano segreti.</label>
  <textarea id="rv-${kind}" rows="4">${esc(text||'')}</textarea>
  <div class="row"><button class="pri" data-act="rv" data-k="${kind}" data-id="${esc(id)}">${on?'Aggiorna':'Mostra ai giocatori'}</button>${on?`<button data-act="hide" data-k="${kind}" data-id="${esc(id)}">Nascondi</button>`:''}</div></div>`;
}

function cityView(){
  const id = S.city, dm = dmOn();
  const c = cityData(id), pub = S.pub[id] || {};
  const nome = c ? c.nome : pub.nome || '';
  const luoghi = dm ? (c?c.luoghi:[]) : Object.values(pub.luoghi||{});
  const shown = luoghi.filter(l => !S.cat || l.cat===S.cat);
  const pins = shown.map(l => {
    const on = !!(pub.luoghi||{})[l.n];
    return `<button class="pin c-${l.cat} ${dm&&!on?'off':''} ${S.sel===l.n?'sel':''}" style="left:${l.x/MW*100}%;top:${l.y/MH*100}%" data-act="sel" data-n="${l.n}" aria-label="${esc(l.nome)}" title="${esc(l.nome)}">${l.n}</button>`
      + (S.names ? `<button class="lbl plbl" data-x="${l.x}" data-y="${l.y}" data-g="17" data-pri="${S.sel===l.n?3:1}" data-act="sel" data-n="${l.n}">${esc(l.nome)}</button>` : '');
  }).join('');
  const chips = `<div class="chips"><button class="${!S.cat?'on':''}" data-act="cat" data-c="">Tutti</button>${Object.entries(CATS).map(([k,v])=>`<button class="${S.cat===k?'on':''}" data-act="cat" data-c="${k}"><span class="sw c-${k}"></span>${v.split(',')[0]}</button>`).join('')}</div>`;
  const tabs = dm ? ['luoghi','guida','missioni','voci','cambia'] : ['luoghi'];
  const tabN = {luoghi:'Luoghi',guida:'Guida del Master',missioni:'Missioni',voci:'Voci',cambia:'Come cambia'};
  let body = '';
  if (S.ctab==='luoghi' || !dm) body = placePanel(c,pub,luoghi,dm);
  else if (S.ctab==='guida') body = `<div class="card prose"><p><i>${c.info}</i></p><div class="read">${esc(c.leggere)}</div>${c.com}${c.agganci}</div>`;
  else if (S.ctab==='missioni') body = c.missioni.map(q => { const pq=(pub.missioni||{})[q.id]; return `<div class="card prose"><h3>${esc(q.titolo)}</h3>${q.html}
    <div class="dm"><h4>Per i giocatori</h4><span class="tag ${pq?'vis':'hid'}">${pq?'visibile':'nascosta'}</span>
    <label for="mq-${q.id}" style="display:block;margin-top:8px">Che cosa sanno i giocatori</label><textarea id="mq-${q.id}" rows="3">${esc(pq?pq.testo:strip(q.chiede))}</textarea>
    <label for="ms-${q.id}">Stato</label><select id="ms-${q.id}">${['Proposta','In corso','Completata','Fallita'].map(s=>`<option ${pq&&pq.stato===s?'selected':''}>${s}</option>`).join('')}</select>
    <div class="row"><button class="pri" data-act="mq" data-id="${q.id}">${pq?'Aggiorna':'Mostra ai giocatori'}</button>${pq?`<button data-act="mqh" data-id="${q.id}">Nascondi</button>`:''}</div></div></div>`; }).join('');
  else if (S.ctab==='voci') body = `<div class="card prose">${c.voci}</div>`;
  else body = `<div class="card prose">${c.cambia}</div>`;
  const cityBox = dm ? revealBox('c',id,!!pub.rivelata,pub.testo!=null?pub.testo:c.leggere,'Descrizione della città per i giocatori') : (pub.testo?`<div class="card"><div class="read">${md(pub.testo)}</div></div>`:'');
  return `<div class="tools"><button data-act="back">← Il regno</button><h2 style="margin:0 8px">${esc(nome)}</h2></div>
  ${dm?`<div class="tabs">${tabs.map(t=>`<button class="${S.ctab===t?'on':''}" data-act="ctab" data-t="${t}">${tabN[t]}</button>`).join('')}</div>`:''}
  <div class="grid"><div>
    <div class="tools">${chips}<span style="flex:1"></span><button data-act="names">${S.names?'Nascondi i nomi':'Mostra i nomi'}</button><button data-act="zoom">${S.zoom>1?'Riduci':'Ingrandisci'}</button></div>
    <div class="mapwrap"><div class="mapin" style="width:${S.zoom*100}%"><img src="${esc(pvMap(c?c.map:pub.map))}" alt="Mappa di ${esc(nome)}">${pins}</div></div>

  </div><div class="panel">${body}</div></div>`;
}

function placePanel(c,pub,luoghi,dm){
  const l = luoghi.find(x=>x.n===S.sel);
  const list = `<div class="card"><h3>Luoghi</h3><ul class="list">${luoghi.filter(x=>!S.cat||x.cat===S.cat).map(x=>`<li data-act="sel" data-n="${x.n}"><span class="sw c-${x.cat}"></span><b>${x.n}</b> ${esc(x.nome)}${dm?((pub.luoghi||{})[x.n]?' <span class="tag vis">visibile</span>':''):''}</li>`).join('') || '<li class="muted">Nessun luogo ancora scoperto.</li>'}</ul></div>`;
  if (!l) return `<div class="card"><p class="muted">Tocca un numero sulla mappa per aprire il luogo.</p></div>` + list;
  const pl = (pub.luoghi||{})[l.n], pp = (pub.png||{})[l.n], pd = (pub.dicerie||{})[l.n];
  let h = `<div class="card"><div class="muted"><span class="sw c-${l.cat}"></span>${CATS[l.cat]} · n. ${l.n}</div><h3>${esc(l.nome)}</h3>`;
  if (dm){
    h += `<div class="prose">${l.desc}</div>`;
    const rid = portrait(l.n);
    if (l.png) h += `<div class="note">${rid?`<img class="ritr" src="${esc(imgSrc(rid))}" alt="Ritratto">`:''}<b>Chi c'è.</b> ${l.png.chi}<br><b>Che cosa racconta.</b> ${l.png.dice}
      ${dm?`<div class="row"><label class="upl">${rid?'Cambia ritratto':'Carica un ritratto'}<input type="file" accept="image/*" data-up="${l.n}"></label>${rid?`<button data-act="unritr" data-n="${l.n}">Togli ritratto</button>`:''}</div><div class="muted" id="upmsg"></div>`:''}</div>`;
    h += revealBox('l', l.n, !!pl, pl?pl.testo:'', 'Che cosa vedono i giocatori qui');
    if (l.png){
      const npc = strip(l.png.chi).replace(/\s*\((?:[^()]|\([^()]*\))*\)/g,'').replace(/\s+\./g,'.');
      const rum = strip(l.png.dice).replace(/\s*\((vero|falso|mezzo vero|forse vero|forse)[\s\S]*$/i,'');
      h += revealBox('p', l.n, !!pp, pp?pp.testo:npc, 'Il PNG come lo conoscono i giocatori');
      h += revealBox('d', l.n, !!pd, pd?pd.testo:rum, 'La diceria che hanno sentito');
    }
  } else {
    if (pl && pl.testo) h += `<div class="prose">${md(pl.testo)}</div>`;
    if (pp) h += `<div class="note">${pp.img?`<img class="ritr" src="${esc(imgSrc(pp.img))}" alt="Ritratto">`:''}<b>Chi c'è.</b> ${md(pp.testo)}</div>`;
    if (pd) h += `<div class="note"><b>Che cosa si dice.</b> ${md(pd.testo)}</div>`;
  }
  return h + `</div>` + list;
}

const portrait = n => ((S.master.ritratti||{}).map||{})[S.city+'-'+n] || null;
async function shrink(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', .86));
}
async function setPortrait(n, file){
  const key = S.city+'-'+n, msg = $('#upmsg');
  try {
    let id = null;
    if (file){ if (msg) msg.textContent = 'Carico il ritratto…'; const d = await pvShrink(file); await S.db.doc('img/' + key).set({d}); S.img = {...(S.img||{}), [key]: {d}}; id = 'img:' + key; }
    else { try { await S.db.doc('img/' + key).delete(); } catch(_) {} }
    const map = {...((S.master.ritratti||{}).map||{})}; if (id) map[key] = id; else delete map[key];
    S.master.ritratti = {map}; render();
    await write('master/ritratti', () => S.db.doc('master/ritratti').set({map}));
    const pub = S.pub[S.city];
    if (pub && pub.png && pub.png[n]) { const p = pubDoc(S.city); if (id) p.png[n].img = id; else delete p.png[n].img; await savePub(S.city, p); }
    toast(id ? 'Ritratto salvato' : 'Ritratto tolto');
  } catch(e){ console.error(e); if (msg) msg.textContent = e && e.code==='too_large' ? 'Immagine troppo grande.' : e && e.code==='unsupported_type' ? 'Formato non supportato: usa JPG, PNG o WebP.' : 'Caricamento non riuscito. Riprova.'; }
}

const heroName = uid => (S.grp[uid] && S.grp[uid].eroe) || 'Eroe senza nome';
const when = t => t ? new Date(t).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
function allItems(kind){ // kind: teo | dia | az
  const out = []; for (const [uid,o] of Object.entries(S[kind])) for (const [id,d] of Object.entries(o||{})) out.push({uid,id,...d});
  return out.sort((a,b)=>(b.creato||0)-(a.creato||0));
}
const peLv = pe => Math.max(1, Math.min(20, Math.floor((1+Math.sqrt(1+8*(Number(pe)||0)/1000))/2)));
const peFor = l => l*(l-1)/2*1000;
const hasPe = g => g.pe!==undefined && g.pe!=='' && !isNaN(Number(g.pe));
const heroLv = g => hasPe(g) ? peLv(g.pe) : (Number(g.livello)||0);
const fmt = n => Number(n||0).toLocaleString('it-IT');
function heroCard(uid, g, dm, me){
  const lv = heroLv(g), pf = Number(g.pf)||0, max = Number(g.pfmax)||0;
  const pct = max ? Math.max(0,Math.min(100,pf/max*100)) : 0;
  const hc = pct<=25 ? 'low' : pct<=50 ? 'mid' : '';
  const st = max && pf<=-10 ? 'Morto' : max && pf<0 ? 'Morente' : max && pf===0 ? 'Inabile' : '';
  let pe = '';
  if (hasPe(g)) { const a=peFor(lv), b=peFor(lv+1), pp = lv>=20?100:Math.max(0,Math.min(100,(g.pe-a)/(b-a)*100));
    pe = `<div class="bar pe"><i style="width:${pp}%"></i></div><div class="muted">PE ${fmt(g.pe)}${lv<20?` · al ${lv+1}° livello mancano ${fmt(b-g.pe)}`:''}</div>`; }
  return `<div class="hero">${lv?`<span class="lv" title="Livello">${lv}</span>`:''}<h3>${esc(g.eroe||'Eroe senza nome')}</h3><div class="muted">${esc([g.razza,g.classe,g.giocatore?'giocato da '+g.giocatore:''].filter(Boolean).join(' · '))}</div>
    ${pe}
    ${max?`<div class="bar hp ${hc}"><i style="width:${pct}%"></i></div><div><b>PF ${esc(pf)} / ${esc(max)}</b>${g.ca?` · CA ${esc(g.ca)}`:''}${st?` · <span class="tag">${st}</span>`:''}</div>`:(g.ca?`<div>CA ${esc(g.ca)}</div>`:'')}
    ${dm&&max?`<div class="hpctl"><input id="hp-${uid}" inputmode="numeric" placeholder="PF" aria-label="Quantità di PF"><button data-act="hpd" data-u="${uid}">Danno</button><button data-act="hpc" data-u="${uid}">Cura</button></div>`:''}
    ${g.inventario?`<details><summary>Inventario</summary><div class="prose">${md(g.inventario)}</div></details>`:''}
    ${g.note&&(dm||uid===me)?`<details><summary>Note</summary><div class="prose">${md(g.note)}</div></details>`:''}
    ${dm?`<div class="row"><button data-act="hed" data-u="${uid}">Modifica</button>${uid.startsWith('h_')?`<button data-act="hdel" data-u="${uid}">Elimina</button>`:''}</div>`:''}</div>`;
}

function readHero(id, old){
  const P='#'+id+'-', v = k => { const e=$(P+k); return e ? e.value.trim() : undefined; };
  const d = {...(old||{}), eroe:v('eroe'), razza:v('razza'), classe:v('classe'), pe:num(v('pe')), pf:num(v('pf')), pfmax:num(v('pfmax')), ca:num(v('ca')), inventario:$(P+'inv').value, note:$(P+'note').value, aggiornato:Date.now()};
  if (v('gioc')!==undefined) d.giocatore = v('gioc');
  d.livello = hasPe(d) ? peLv(d.pe) : num(v('liv'));
  if (d.pf==='' && d.pfmax!=='') d.pf = d.pfmax;
  if (!d.creato) d.creato = Date.now();
  return d;
}

async function ensureMe(){ if (!S.grp[S.me]) { const d = {eroe:'',creato:Date.now()}; S.grp[S.me] = d; await S.db.doc('gruppo/'+S.me).set(d); } }

// ---------- IL CUSTODE DEL VERSO (solo Master, solo resoconti)
const lastReport = () => Object.values(S.cus).reduce((m,r)=>Math.max(m,r.creato||0),0);
function novelties(){
  const t = lastReport(), out = [];
  for (const a of allItems('az')) if ((a.creato||0) > t) out.push(`AZIONE di ${heroName(a.uid)}: ${a.testo}`);
  for (const a of allItems('teo')) if ((a.creato||0) > t) out.push(`TEORIA di ${heroName(a.uid)}: ${a.testo}`);
  for (const a of allItems('dia')) if ((a.creato||0) > t) out.push(`DIARIO DEL GRUPPO (${heroName(a.uid)}), «${a.titolo}»: ${a.testo}`);
  for (const [uid,g] of Object.entries(S.grp)) if ((g.aggiornato||0) > t) out.push(`SCHEDA di ${heroName(uid)}: ${[g.razza,g.classe,heroLv(g)&&'liv. '+heroLv(g),hasPe(g)&&'PE '+g.pe,g.pfmax&&('PF '+g.pf+'/'+g.pfmax)].filter(Boolean).join(', ')}. Inventario: ${g.inventario||'-'}. Note: ${g.note||'-'}`);
  return out;
}

function revealedSummary(){
  const lines = [];
  for (const [k,p] of Object.entries(S.pub)){
    if (!p || !p.rivelata) continue;
    lines.push(`- ${p.nome}: luoghi noti ${Object.values(p.luoghi||{}).map(l=>l.nome).join(', ')||'nessuno'}; PNG noti ${Object.keys(p.png||{}).length}; dicerie sentite: ${Object.values(p.dicerie||{}).map(d=>d.testo).join(' | ')||'nessuna'}; missioni: ${Object.values(p.missioni||{}).map(m=>m.titolo+' ('+m.stato+')').join(', ')||'nessuna'}`);
  }
  return lines.join('\n') || 'Nessun luogo ancora rivelato.';
}
function searchAtlas(q){
  q = String(q||'').toLowerCase().trim(); if (!q) return [];
  const res = [];
  for (const c of Object.values(S.master)) { if (!c || !c.luoghi) continue;
    for (const l of c.luoghi){ const t = (l.nome+' '+strip(l.desc)+' '+(l.png?strip(l.png.chi)+' '+strip(l.png.dice):'')); if (t.toLowerCase().includes(q)) res.push({citta:c.nome,n:l.n,luogo:l.nome,descrizione:strip(l.desc).slice(0,500),png:l.png?strip(l.png.chi).slice(0,250):null,diceria:l.png?strip(l.png.dice).slice(0,300):null}); }
    for (const m of c.missioni||[]) if ((m.titolo+' '+strip(m.html)).toLowerCase().includes(q)) res.push({citta:c.nome,missione:m.titolo,testo:strip(m.html).slice(0,900)});
    if (res.length >= 10) break; }
  return res.slice(0,10);
}

function cityPubBase(id){
  const c = cityData(id), r = regno().citta.find(x=>x.id===id);
  const p = pubDoc(id);
  return Object.assign({nome:c.nome,x:r.x,y:r.y,map:c.map,rivelata:false,luoghi:{},png:{},dicerie:{},missioni:{}}, p);
}
function reveal(kind,id,on){
  const ta = $('#rv-'+kind), text = ta ? ta.value.trim() : '';
  if (kind==='m'){
    const mi = regno().minori.find(x=>x.id===id); const p = Object.assign({nome:mi.nome,x:mi.x,y:mi.y,minore:true}, pubDoc('m_'+id));
    p.rivelata = on; p.testo = text; return savePub('m_'+id, p);
  }
  const p = cityPubBase(S.city), c = cityData(S.city);
  if (kind==='c'){ p.rivelata = on; p.testo = text; }
  else {
    const n = Number(id), l = c.luoghi.find(x=>x.n===n);
    if (kind==='l'){ if(on) p.luoghi[n]={nome:l.nome,cat:l.cat,x:l.x,y:l.y,n,testo:text}; else delete p.luoghi[n]; }
    if (kind==='p'){ if(on) { p.png[n]={testo:text}; const im = portrait(n); if (im) p.png[n].img = im; } else delete p.png[n]; }
    if (kind==='d'){ if(on) p.dicerie[n]={testo:text}; else delete p.dicerie[n]; }
    if (on && !p.luoghi[n]) p.luoghi[n]={nome:l.nome,cat:l.cat,x:l.x,y:l.y,n,testo:''};
    if (on && !p.rivelata) { p.rivelata = true; if (p.testo==null) p.testo=''; }
  }
  toast(on?'Ora i giocatori lo vedono':'Nascosto ai giocatori');
  return savePub(S.city, p);
}
function mission(qid,on){
  const p = cityPubBase(S.city), q = cityData(S.city).missioni.find(x=>x.id===qid);
  if (on) p.missioni[qid] = {titolo:q.titolo.replace(/\s*\(LI[^)]*\)\s*/,' ').trim(),testo:$('#mq-'+qid).value.trim(),stato:$('#ms-'+qid).value};
  else delete p.missioni[qid];
  toast(on?'Missione aggiornata':'Missione nascosta');
  return savePub(S.city, p);
}

  else if (a==='minor'){ S.minor=b.dataset.id; render(); }

  else if (a==='cat'){ S.cat=b.dataset.c; render(); }

  else if (a==='scdel'){ const id=b.dataset.id; if (b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Conferma'; b.classList.add('wax'); return; } delete S.sc[id]; render(); write('scontri/'+id,()=>S.db.doc('scontri/'+id).delete()); }
  else if (a==='cdel'){ const id=b.dataset.id; if (b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Conferma'; b.classList.add('wax'); return; } delete S.cus[id]; render(); write('custode/'+id,()=>S.db.doc('custode/'+id).delete()); }
  else if (a==='reply'){ const u=b.dataset.u, id=b.dataset.id, d={risposta:$('#r-'+id).value.trim(), stato:$('#st-'+id).value}; S.az[u][id]={...S.az[u][id],...d}; render(); write(`riservate/${u}/azioni/${id}`,()=>S.db.doc(`riservate/${u}/azioni/${id}`).update(d)).then(()=>toast('Risposta inviata')); }
  else if (a==='gdel'){ const {k,u,id}=b.dataset; if (b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Conferma'; b.classList.add('wax'); return; } const key = k==='teorie'?'teo':'dia'; if (S[key][u]) delete S[key][u][id]; render(); S.db.doc(`gruppo/${u}/${k}/${id}`).delete().catch(e=>toast('Non sono riuscito a eliminare')); }
  else if (a==='hpd'||a==='hpc'){ const u=b.dataset.u, n=Math.abs(Math.round(Number($('#hp-'+u).value))); if(!n) return toast('Scrivi quanti PF'); const g={...S.grp[u]}, max=Number(g.pfmax)||0; let pf=Number(g.pf)||0; pf = a==='hpd' ? pf-n : Math.min(max, pf+n); g.pf=pf; g.aggiornato=Date.now(); S.clearForm=true; saveHero(u,g); }
  else if (a==='rest'){ for (const [u,g0] of Object.entries(S.grp)) if (g0.eroe && g0.pfmax!=='' && g0.pfmax!==undefined && Number(g0.pf)!==Number(g0.pfmax)) saveHero(u,{...g0,pf:Number(g0.pfmax),aggiornato:Date.now()}); toast('Tutti gli eroi sono ai PF massimi'); }
  else if (a==='hed'){ S.hedit=b.dataset.u; S.clearForm=true; render(); const x=$('#hbox'); if(x) x.scrollIntoView({behavior:'smooth'}); }
  else if (a==='hcancel'){ S.hedit=null; S.clearForm=true; render(); }
  else if (a==='hdel'){ const u=b.dataset.u; if (b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Conferma'; b.classList.add('wax'); return; } delete S.grp[u]; render(); write('gruppo/'+u,()=>S.db.doc('gruppo/'+u).delete()); }
  else if (a==='rv') reveal(b.dataset.k,b.dataset.id,true);
  else if (a==='hide') reveal(b.dataset.k,b.dataset.id,false);
  else if (a==='mq') mission(b.dataset.id,true);
  else if (a==='mqh') mission(b.dataset.id,false);
  else if (a==='ed'){ S.edit=b.dataset.id; S.clearForm=true; render(); window.scrollTo(0,0); }
  else if (a==='cancel'){ S.edit=null; S.clearForm=true; render(); }
  else if (a==='tog'){ const id=b.dataset.id, en={...S.dm[id],pubblico:!S.dm[id].pubblico}; S.dm[id]=en; render(); write('diario_m/'+id,()=>S.db.doc('diario_m/'+id).set(en)).then(()=>syncPublic(id,en)); }
  else if (a==='del'){ const id=b.dataset.id; if (b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Conferma eliminazione'; b.classList.add('wax'); return; } delete S.dm[id]; render(); write('diario_m/'+id,()=>S.db.doc('diario_m/'+id).delete()).then(()=>syncPublic(id,null)); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id==='ed') saveEntry();
  if (e.target.id==='imp') importSeed($('#pw').value.trim());
  if (['fs','fa','ft','fd','fh','fxp'].includes(e.target.id)) groupSubmit(e.target.id);
  if (e.target.id==='fc') activateCanone($('#cpw').value.trim());
  if (e.target.id==='fsc') activateArsenale($('#spw').value.trim());
  if (e.target.id==='fsone') runScontri('one', {n:Number($('#sc-n').value), note:$('#sc-note').value.trim()});
});

// ---------- importazione cifrata
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptFile(name, pw){
  const f = window.PV_FILE ? JSON.parse(window.PV_FILE(name)) : await (await fetch('pv_' + name, {cache: 'no-cache'})).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(f.salt),iterations:f.iter,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(f.iv)}, key, b64(f.ct))));
}
async function importSeed(pw){
  const msg = $('#impmsg'); msg.textContent = 'Decifro…';
  try {
    const data = await decryptFile('seed.enc.json', pw);
    const ids = Object.keys(data.citta);
    for (let i=0;i<ids.length;i++){ msg.textContent = `Salvo ${data.citta[ids[i]].nome} (${i+1}/${ids.length+1})…`; await S.db.doc('master/'+ids[i]).set(data.citta[ids[i]]); }
    await S.db.doc('master/_regno').set(data.regno);
    msg.textContent = 'Fatto.'; toast('Saga importata');
  } catch(err){ console.error(err); msg.textContent = err && err.code ? 'Non sono riuscito a salvare: '+err.code : 'Parola d\'ordine sbagliata.'; }
}

// ---------- avvio
function route(){ const h=location.hash.replace('#',''); S.view=['prefazione','diario','atlante','missioni','taccuino','gruppo'].includes(h)?h:'prefazione'; if(S.view!=='atlante'){S.city=null;} render(); }
window.addEventListener('hashchange', route);
function listen(path, target){
  return S.db.collection(path).onSnapshot(snap => {
    const o = {}; for (const d of snap.docs) o[d.id] = d.data();
    S[target] = o; if (!snap.metadata.fromCache) { S.got[path]=true; if (S.need.every(p=>S.got[p])) { S.loaded=true; clearTimeout(S.timer); } }
    render();
  }, err => { console.error(err); S.loaded=true; if (err.code==='revoked') S.err='Non hai più accesso a questo giornale.'; render(); });
}
function sub(path, onData){
  if (S.subs[path]) return;
  S.subs[path] = S.db.collection(path).onSnapshot(snap => { const o = {}; for (const d of snap.docs) o[d.id] = d.data(); onData(o); render(); maybeAuto(); }, err => console.error(path, err));
}
function listenGroup(){
  S.subs.gruppo = S.db.collection('gruppo').onSnapshot(snap => {
    const o = {}; for (const d of snap.docs) o[d.id] = d.data(); S.grp = o;
    S.got.gruppo = true; if (S.need.every(p=>S.got[p])) { S.loaded=true; clearTimeout(S.timer); }
    for (const uid of Object.keys(o)) {
      sub(`gruppo/${uid}/teorie`, v => S.teo[uid] = v);
      sub(`gruppo/${uid}/diario`, v => S.dia[uid] = v);
      if (S.isDM) sub(`riservate/${uid}/azioni`, v => S.az[uid] = v);
    }
    render(); maybeAuto();
  }, err => { console.error(err); S.got.gruppo = true; render(); });
  if (!S.isDM && S.me) sub(`riservate/${S.me}/azioni`, v => S.az[S.me] = v);
}
(async () => {
  route();
  const [db0, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  const db = db0 ? pvDb(db0) : null; S.assets = null;
  S.db = db; S.user = user;
  if (!db){ S.err = 'Il giornale non riesce a collegarsi ai dati del Tavolo. Ricarica la pagina.'; render(); return; }
  let tavM = false; try { tavM = sessionStorage.getItem('tavolo-master') === '1'; } catch(_) {}
  S.isDM = !!(tavM && user && (user.isOwner() || (user.canEdit && user.canEdit())));
  S.got = {}; S.need = S.isDM ? ['pubblico','diario_p','master','diario_m','gruppo'] : ['pubblico','diario_p','gruppo'];
  S.timer = setTimeout(()=>{ S.loaded=true; render(); toast('Il giornale risponde lentamente: i dati potrebbero non essere aggiornati'); }, 10000);
  try { S.me = user ? await user.id() : null; } catch(_) { S.me = null; }
  try { S.auto = localStorage.getItem('custodeAuto') === '1'; S.autoSc = localStorage.getItem('scontriAuto') === '1'; } catch(_) {}
  S.sample = null;
  listen('pubblico','pub'); listen('diario_p','dp');
  S.db.collection('testi').onSnapshot(snap => { const o = {}; for (const d of snap.docs) o[d.id] = d.data(); S.testi = o; render(); }, e => console.error(e));
  S.db.collection('img').onSnapshot(snap => { const o = {}; for (const d of snap.docs) o[d.id] = d.data(); S.img = o; render(); }, e => console.error(e));
  listenGroup();
  if (S.isDM){ listen('master','master'); listen('diario_m','dm'); listen('custode','cus'); listen('scontri','sc');
  }
  render();
})();
}
