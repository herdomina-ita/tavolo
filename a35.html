<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>Sala d&#39;Armi 3.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE: un tavolo da guerra del Master, pratico e veloce, da usare mentre si gioca.
   IDEA: il tabellone della sala d'armi: ferro, braci e gettoni di ottone sul tavolo.
   PICTURE: l'incontro in costruzione, grande, con il suo LI e la barra della difficoltà.
   COLOUR and TYPE: ferro scuro e osso, brace arancione per il pericolo; Alegreya SC per i titoli, Alegreya Sans per il resto.
   LAYOUT: barra con le sezioni; a sinistra il lavoro (gruppo, generatore, bestiario), a destra l'incontro sempre visibile; una colonna sul telefono. */
:root{color-scheme:light dark;
--bg:light-dark(#ece7de,#171513);--card:light-dark(#fbf8f2,#221f1b);--ink:light-dark(#221d17,#ece4d6);--soft:light-dark(#6c6355,#a99f8f);
--line:light-dark(#d6cdbd,#3a342c);--brace:light-dark(#c4521f,#f08a4b);--ottone:light-dark(#9a7426,#d9b25a);--chip:light-dark(#e6dfd2,#2c2823)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Alegreya Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Alegreya SC",Georgia,serif;line-height:1.1;margin:0 0 .4em;text-wrap:balance}
h2{font-size:clamp(24px,3vw,30px)}h3{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
.schf label{display:block;margin:8px 0 3px}.schf textarea{font-family:inherit;resize:vertical}
button{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
button:hover{border-color:var(--brace)}
button.pri{background:var(--brace);border-color:var(--brace);color:#fff6ee;font-weight:700}
button.sm{min-height:36px;padding:0 10px;font-size:15px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brace);outline-offset:2px}
input,select,textarea{font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);width:100%}
label{font-size:14px;color:var(--soft);display:block;margin:6px 0 2px}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:3px solid var(--brace);padding:10px max(3vw,14px);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
header h1{font-size:22px;margin:0;color:var(--brace)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:9px 13px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
nav a.on{background:var(--chip);color:var(--brace)}
.pl{margin-left:auto;font-size:15px;color:var(--soft)}.pl b{color:var(--ink);font-size:18px}
main{max-width:1280px;margin:0 auto;padding:18px max(3vw,14px) 60px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:920px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.muted{color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:600px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--soft);font-weight:500}
td.n,th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.side{position:sticky;top:78px}
.el{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.el .big{font:700 clamp(54px,8vw,80px)/1 "Alegreya SC",serif;color:var(--brace)}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:10px 0 4px}
.bar i{height:10px;border-radius:3px;background:var(--chip)}
.bar i.on{background:var(--brace)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:14px}
.d0{background:#d8ead2;color:#244a1d}.d1{background:#d6e4f2;color:#1d3a5c}.d2{background:#f7e2bf;color:#6b4206}.d3{background:#f6cdbb;color:#7a240a}.d4{background:#3b1d14;color:#ffd6c4}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.step{display:flex;align-items:center;gap:4px}.step button{min-height:34px;width:34px;padding:0}
.step span{min-width:26px;text-align:center;font-weight:700}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cand{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.cand>b{display:block}.cand>a.lnk{font-weight:700}.cand .muted{font-size:14px}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 70px minmax(0,1fr) 44px;gap:8px;align-items:end;padding:6px 0;border-bottom:1px dotted var(--line)}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 60px 44px}.hero .mancano{display:none}}
.lv{font:700 26px/1 "Alegreya SC",serif;text-align:center;color:var(--ottone)}
.empty{padding:22px;text-align:center;color:var(--soft)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){table{font-size:14px}}
.lnk{border:0;background:none;padding:0;min-height:30px;font-weight:700;color:inherit;text-align:left;text-decoration:underline dotted var(--soft);text-underline-offset:3px;cursor:pointer}
.lnk:hover{color:var(--brace)}
.ico{min-height:26px;width:26px;padding:0;margin-left:6px;border-radius:50%;font:700 italic 14px/1 Georgia,serif;color:var(--soft);vertical-align:1px}
.ico:hover{color:var(--brace)}
.seg{display:flex;gap:4px;flex-wrap:wrap;background:var(--chip);padding:4px;border-radius:10px;margin-bottom:14px}
.seg button{border:0;background:none;flex:1 1 auto}
.seg button.on{background:var(--card);color:var(--brace);font-weight:700}
.mini{font-size:13px;color:var(--soft);display:block}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);margin:0;min-height:44px}.chk input{width:22px;height:22px}
.prop{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);margin-top:10px}
.prop ul{margin:6px 0 10px;padding-left:18px}
.d8 td:first-child{font:700 20px/1 "Alegreya SC",serif;color:var(--ottone);width:48px}
.d8 tr.hit{background:var(--chip)}.d8 tr.hit td:first-child{color:var(--brace)}
.veil{position:fixed;inset:0;background:rgb(0 0 0/.55);z-index:40;display:grid;place-items:center;padding:16px}
.veil[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--brace);border-radius:12px;max-width:620px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px}
.sheet dl{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:6px 12px;margin:12px 0}
.sheet dt{color:var(--soft);font-size:14px}.sheet dd{margin:0}
@media(max-width:600px){.sheet dl{grid-template-columns:minmax(0,1fr)}.sheet dt{margin-top:6px}}
.back{font-weight:700;color:var(--brace);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.sm2{min-height:36px;font-size:14px;font-weight:500;color:var(--ink);border-color:var(--line);margin-left:6px}
.mhead{display:flex;justify-content:space-between;align-items:end;gap:12px;border-bottom:3px solid var(--brace);padding-bottom:10px}
.gsbox{text-align:center;border:2px solid var(--ottone);border-radius:10px;padding:4px 12px;flex:none}.gsbox span{display:block;font-size:12px;color:var(--soft)}.gsbox b{font:700 30px/1 "Alegreya SC",serif;color:var(--ottone)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.quick div{background:var(--chip);border-radius:8px;padding:8px 10px}.quick span{display:block;font-size:12px;color:var(--soft)}.quick b{font-size:17px}
@media(max-width:600px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
table.sb th{width:12em;font-size:14px;color:var(--soft);font-weight:500;vertical-align:top}table.sb td{vertical-align:top}
table.sb tr:nth-child(even){background:color-mix(in srgb,var(--chip) 50%,transparent)}
@media(max-width:600px){table.sb th,table.sb td{display:block;width:auto;border:0;padding:2px 4px}table.sb th{padding-top:8px}table.sb tr{border-bottom:1px solid var(--line);display:block}}
.mtop{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:16px;margin:14px 0;align-items:start}
.mtop .quick{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:0}
.pic{margin:0;border-radius:12px;overflow:hidden;background:var(--chip);position:relative;aspect-ratio:1}
.pic svg,.pic img{display:block;width:100%;height:100%;object-fit:cover}
.pic figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:13px;color:#f6ead8;background:linear-gradient(transparent,rgb(0 0 0/.6))}
.pic.drop{outline:3px dashed var(--brace);outline-offset:-3px}
label.btnl.up{display:inline-flex;margin:0;font-size:15px;cursor:pointer}
@media(max-width:600px){.mtop{grid-template-columns:minmax(0,1fr)}.pic{max-width:320px}}
.dropz{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;background:var(--bg)}
.dropz.drop{border-color:var(--brace)}
.bk{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.bk img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--chip)}
.bk.miss input{border-color:var(--brace)}
.fastgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:10px;align-items:start}
.fastgrid img{width:100%;max-height:420px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line)}
.sug{display:flex;flex-direction:column;gap:4px;margin-top:6px}.sug button{text-align:left;justify-content:flex-start}.sug button.on{border-color:var(--brace);background:var(--chip)}
@media(max-width:600px){.fastgrid{grid-template-columns:minmax(0,1fr)}}
body:not(.ed) .edonly,body:not(.ed) [data-act=add],body:not(.ed) [data-act=addmix],body:not(.ed) [data-act=addtab],body:not(.ed) [data-act=addh],body:not(.ed) [data-act=delh],body:not(.ed) [data-act=load],body:not(.ed) [data-act=dels],body:not(.ed) [data-stato],body:not(.ed) [data-act=delimg]{display:none!important}
input[readonly]{background:transparent;border-color:transparent;padding-left:0}
.mbtn{margin-left:8px}.mbtn.on{background:var(--brace);border-color:var(--brace);color:#fff6ee;font-weight:700}
.pwerr{color:var(--brace);font-weight:700;min-height:1.5em;margin:6px 0}
.card a:not(.btnl):not(.lnk):not(.back){color:var(--brace)}
.stat{font-size:13px;color:var(--soft);display:block}
.btnl{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--brace);color:var(--brace);font-weight:700;text-decoration:none}
.btnl:hover{background:var(--chip)}
body.wide main{grid-template-columns:minmax(0,1fr)}body.wide #side{display:none}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:0 6px;border-radius:6px;background:var(--chip);color:var(--brace);vertical-align:1px}
#nav{flex-wrap:wrap}
.pgrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.pgg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.pgg4 select,.pgg4 input{width:100%}
.pgcar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.pgc{background:var(--chip);border-radius:10px;padding:8px;text-align:center}

.pgc label{font-size:12px;margin:6px 0 2px;text-align:left}.pgc input,.pgc select{width:100%;text-align:center}
.pgstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.pgstat div{background:var(--chip);border-radius:8px;padding:8px 10px}.pgstat span{display:block;font-size:13px;color:var(--soft)}.pgstat b{font-size:22px}.pgstat em{display:block;font-style:normal;font-size:13px;color:var(--soft)}
.pg2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}.pg2>.card{margin:0 0 16px}

.pgslot{display:flex;flex-wrap:wrap;gap:8px}.pgslot div{background:var(--chip);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:4px}.pgslot span{font-weight:700;margin-right:4px}
.pgmon{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.pgmon input{width:100%}
.pgwarn{margin:10px 0 0;padding:8px 10px;border-left:3px solid var(--brace);background:var(--chip);border-radius:6px}.pgbad{color:var(--brace);font-weight:600}
details.pgf{border-bottom:1px solid var(--line);padding:6px 0}details.pgf summary{cursor:pointer;font-weight:600;min-height:30px;display:flex;align-items:center;gap:6px}details.pgf p{margin:6px 0;max-width:75ch}

.card h4{margin:14px 0 6px;color:var(--brace)}

table.pgsk3 input{text-align:center}.pgbook{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.pgchip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 10px;font-size:14px}.pgx{min-height:26px;width:26px;padding:0;border:0;background:none;color:var(--soft)}.pgx:hover{color:var(--brace)}.pgbook select{max-width:240px;min-height:34px}.pgspec{display:inline-flex;align-items:center;gap:2px;flex-wrap:wrap}.pgspec input{width:150px!important;text-align:left!important;min-height:34px;padding:2px 6px}input.pgbadin{border-color:var(--brace);color:var(--brace)}table.pgt td textarea{width:100%;min-height:34px}
</style>

const TIPI = [...new Set(B.map(b=>b.tipo))].sort(), AMB = ZONE.map(z=>z[0]);
const FORME = [['capo','Capo e gregari'],['due','Due gruppi'],['trio','Tre specie']];
const DIFF = [['Facile',-1],['Adatto',0],['Impegnativo',1],['Molto pericoloso',3]];
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = {view:'gruppo', db:null, canWrite:true, eroi:[{nome:'Eroe 1',pe:0},{nome:'Eroe 2',pe:0},{nome:'Eroe 3',pe:0},{nome:'Eroe 4',pe:0}],
  inc:{nome:'',note:'',voci:[]}, saved:{}, q:'', fTipo:'', fAmb:'', gsMin:'', gsMax:'', gen:{diff:'Adatto',n:2,tipo:'',amb:'',mode:'singola',forma:'capo',affini:true}, pick:null, sort:'gs', imgs:{}, master:false, mix:null, tab:null, roll:null};
try { const d = JSON.parse(localStorage.getItem('sala-bozza')||'null'); if (d) S.inc = d; } catch(_) {}
try { S.master = sessionStorage.getItem('tavolo-master') === '1'; } catch(_) {}
const ED = () => S.master && S.canWrite;
const MHASH = 'a8cbcac0410cd8074f92bb7f98443ac92bc0a0665d0212aa9c619e62e607027c';

// ---------- regole
const livello = pe => Math.min(20, Math.floor((1 + Math.sqrt(1 + 8 * Math.max(0, Number(pe)||0) / 1000)) / 2));
const peLivello = l => l*(l-1)/2*1000;
const partyLevel = () => { const ls = S.eroi.map(e=>livello(e.pe)); return ls.length ? Math.round(ls.reduce((a,b)=>a+b,0)/ls.length) : 1; };
const gsTxt = g => g>=1 ? String(g) : g>0.45 ? '1/2' : g>0.3 ? '1/3' : g>0.2 ? '1/4' : g>0.15 ? '1/6' : '1/8';
const eqGs = g => g >= 1 ? g : 1 + 2*Math.log2(g);            // GS frazionari: due GS 1/2 = GS 1
const bonusN = n => n<=1?0 : n<=4?n : n<=6?5 : n<=9?6 : n<=12?7 : 8;
function encounterLevel(voci){
  const tot = voci.reduce((s,v)=>s + v.n * Math.pow(2, eqGs(v.gs)/2), 0);
  if (!tot) return null;
  return Math.round(2*Math.log2(tot));
}
function difficulty(el){
  if (el == null) return null;
  const d = el - partyLevel();
  return d < 0 ? ['Facile',0] : d === 0 ? ['Adatto',1] : d <= 2 ? ['Impegnativo',2] : d <= 4 ? ['Molto pericoloso',3] : ['Quasi impossibile',4];
}
function neededGs(diff, n){
  const li = partyLevel() + (DIFF.find(d=>d[0]===diff)||DIFF[1])[1];
  const g = li - bonusN(n);
  return {li, gs: g >= 1 ? g : g === 0 ? 0.5 : g === -1 ? 1/3 : g === -2 ? 0.25 : 0.125};
}
const same = (a,b) => Math.abs(a-b) < 0.02;

// ---------- generatore misto
const rnd = a => a[Math.floor(Math.random()*a.length)];
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const gsFor = g => g >= 1 ? g : g === 0 ? 0.5 : g === -1 ? 1/3 : g === -2 ? 0.25 : 0.125;
const targetLi = diff => Math.max(1, partyLevel() + (DIFF.find(d=>d[0]===diff)||DIFF[1])[1]);
const poolOf = (tipo, amb) => B.filter(b => (!tipo || b.tipo===tipo) && inZona(b, amb));
const affine = (list, c) => { const a = list.filter(b => b.tipo===c.tipo || (c.zone!=='*' && [...c.zone].some(z=>b.zone.includes(z)))); return a.length ? a : list; };
const toVoci = arr => arr.map(([b,n]) => ({id:b.id, nome:b.nome, gs:b.gs, n}));
function single(li, pool){
  for (const n of [ri(1,6), ri(1,4), 1, 2, 3, 4, 6, 8]) {
    const gs = gsFor(li - bonusN(n)), l = pool.filter(b => same(b.gs, gs));
    if (l.length) return toVoci([[rnd(l), n]]);
  }
  return null;
}
function mixed(forma, li, pool, aff){
  const band = (lo, hi) => pool.filter(b => { const e = eqGs(b.gs); return e >= lo && e <= hi; });
  for (let t = 0; t < 3000; t++) {
    let arr;
    if (forma === 'capo') {
      const caps = band(li-3, li-1); if (!caps.length) return null;
      const c = rnd(caps); let g = pool.filter(b => b.id !== c.id && eqGs(b.gs) <= eqGs(c.gs) - 2);
      if (aff) g = affine(g, c); if (!g.length) continue;
      arr = [[c,1],[rnd(g), ri(2,8)]];
    } else {
      const k = forma === 'due' ? 2 : 3, p = band(li - 9, li - (k===2?2:3)); if (p.length < k) return null;
      const a = rnd(p); arr = [[a, ri(1, k===2?6:4)]];
      while (arr.length < k) { let q = p.filter(b => !arr.some(([x]) => x.id === b.id)); if (aff) q = affine(q, a); arr.push([rnd(q), ri(1, k===2?6:4)]); }
    }
    const v = toVoci(arr); if (encounterLevel(v) === li) return v;
  }
  return null;
}
function makeMix(){
  const g = S.gen, li = targetLi(g.diff), pool = poolOf(g.tipo, g.amb), out = [];
  for (let i = 0; i < 12 && out.length < 3; i++) { const v = mixed(g.forma, li, pool, g.affini); if (v && !out.some(o => JSON.stringify(o)===JSON.stringify(v))) out.push(v); }
  S.mix = out;
}
const TAB = [[1,'Facile',-2],[2,'Facile',-1],[3,'Adatto',0],[4,'Adatto',0],[5,'Adatto',0],[6,'Impegnativo',1],[7,'Impegnativo',2],[8,'Molto pericoloso',3]];
function makeTab(){
  const pool = poolOf('', S.gen.amb), own = S.gen.amb ? B.filter(b => b.zone.includes(S.gen.amb)) : pool, pl = partyLevel();
  S.roll = null;
  S.tab = TAB.map(([d,lab,off]) => {
    const li = Math.max(1, pl + off), forma = rnd(['single','single','capo','due']);
    const v = (forma === 'single' ? single(li, own) : mixed(forma, li, own, true)) || single(li, own) || (forma === 'single' ? single(li, pool) : mixed(forma, li, pool, true)) || single(li, pool) || mixed('capo', li, pool, true);
    return {d, lab, li, voci: v};
  });
}

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.k); toast.k=setTimeout(()=>t.classList.remove('on'),2000); }
let qw = Promise.resolve();
function save(path, data){
  if (!S.db || !S.canWrite) return;
  qw = qw.then(() => data === null ? S.db.doc(path).delete() : S.db.doc(path).set(data)).catch(e => { console.error(e); if (e && e.code==='invalid_argument'){ S.canWrite=false; toast('Solo il Master può salvare'); } else toast('Salvataggio non riuscito'); });
}

  for (const el of document.querySelectorAll('#work input[id]:not([type=file]), #work textarea[id]')) keep[el.id] = [el.value, el.selectionStart];
  $('#work').innerHTML = S.view==='generatore' ? genView() : S.view==='bestiario' ? bestView() : S.view==='incontri' ? savedView() : S.view==='mostro' ? monsterView() : S.view==='immagini' ? bulkView() : S.view==='pg' ? pgListView() : S.view==='pgscheda' ? pgSheetView() : groupView();
  for (const [id,[v,p]] of Object.entries(keep)) { const el = document.getElementById(id); if (el && el.type!=='number') { el.value = v; } }
  if (act) { const el = document.getElementById(act); if (el) { el.focus(); try { if (keep[act]) el.setSelectionRange(keep[act][1], keep[act][1]); } catch(_){} } }
  $('#side').innerHTML = sideView();
}

  return `<div class="card"><h2>Tabella del luogo</h2>${seg}

function sugg(q){
  const n = norm(q); if (!n) return [];
  const pre = [], mid = [];
  for (const b of B) { const a = norm(b.nome), e = norm(b.en); if (a.startsWith(n) || e.startsWith(n)) pre.push(b); else if (a.includes(n) || e.includes(n)) mid.push(b); }
  return [...pre.sort((x,y)=>x.nome.length-y.nome.length), ...mid].slice(0, 6);
}

function fastGo(d){

  if (d > 0) { let k = i; while (k < L.length && L[k].id != null) k++; if (k < L.length) i = k; }
  if (i >= L.length) { S.fast = null; render(); toast('Arrivato alla fine: controlla e salva'); return; }
  S.fast = Math.max(0, i); S.sel = 0; render(); const f = $('#fastin'); if (f) { f.value = ''; f.focus(); }
}

function addVoci(v){ for (const x of v) { const ex = S.inc.voci.find(y => y.id === x.id); if (ex) ex.n += x.n; else S.inc.voci.push({...x}); } saveDraft(); render(); toast("Creature nell'incontro"); }
function addCreature(id, n){
  const b = B[id], ex = S.inc.voci.find(v => v.id === id);
  if (ex) ex.n += n; else S.inc.voci.push({id, nome:b.nome, gs:b.gs, n});
  saveDraft(); render(); toast(`${n} × ${b.nome} nell'incontro`);
}

  else if (a==='rand'){ const {gs} = neededGs(S.gen.diff, S.gen.n); const l = B.filter(x => same(x.gs, gs) && (!S.gen.tipo || x.tipo===S.gen.tipo) && inZona(x, S.gen.amb)); if (l.length) { S.pick = l[Math.floor(Math.random()*l.length)].id; render(); } }

  else if (a==='fastoff'){ S.fast = null; render(); }
  else if (a==='fastmove'){ const d = Number(b.dataset.d); if (d < 0) { S.fast = Math.max(0, S.fast-1); S.sel = 0; render(); const f = $('#fastin'); if (f) { f.value=''; f.focus(); } } else { S.fast = Math.min(S.bulk.length-1, S.fast+1); S.sel = 0; render(); const f = $('#fastin'); if (f) { f.value=''; f.focus(); } } }
  else if (a==='fastclear'){ S.bulk[S.fast].id = null; render(); }
  else if (a==='fastpick'){ fastPick(Number(b.dataset.id)); }
  else if (a==='bulkskip'){ S.bulk[Number(b.dataset.i)].id = null; render(); }
  else if (a==='delimg'){ if (b.dataset.ok!=='1'){ b.dataset.ok='1'; b.textContent='Conferma'; return; } S.imgs['m'+b.dataset.id] = ''; save('immagini/m'+b.dataset.id, null); render(); toast('Immagine rimossa'); }

  $('#sheet').innerHTML = `<form id="mform"><div class="row" style="justify-content:space-between;align-items:start"><h2 id="sh-t" style="margin:0">Modalità Master</h2><button type="button" class="sm" data-act="close" aria-label="Chiudi">✕</button></div>
  <p class="muted">Inserisci la password per modificare gruppo, incontri e immagini.</p>
  <label for="mpw">Password</label><input id="mpw" type="password" autocomplete="current-password" required>
  <p class="pwerr" id="pwerr" aria-live="polite"></p>
  <div class="row"><button class="pri" type="submit">Entra</button><button type="button" data-act="close">Annulla</button></div></form>`;
  S.back = document.activeElement; $('#veil').hidden = false; $('#mpw').focus();
}
document.addEventListener('submit', async e => {
  if (e.target.id === 'schform') {
    e.preventDefault(); if (!ED()) return;
    const id = Number(e.target.dataset.id), fd = new FormData(e.target), o = {nome: B[id].nome};
    for (const k of SK) o[k] = String(fd.get(k) || '').trim();
    S.schede = S.schede || {}; S.schede['m'+id] = o; S.edsch = null;
    save('schede/m'+id, o); render(); toast('Scheda salvata'); return;
  }
  if (e.target.id !== 'mform') return;
  e.preventDefault();
  let ok = false;
  try { ok = (await sha($('#mpw').value)) === MHASH; } catch (err) { console.error(err); }
  if (!ok) { $('#pwerr').textContent = 'Password errata.'; $('#mpw').select(); return; }
  S.master = true; try { sessionStorage.setItem('sala-master', '1'); } catch(_) {}
  closeSheet(); render();
  toast(S.canWrite ? 'Modalità Master attiva' : 'Password giusta, ma il tuo account non può modificare questa pagina');
});

async function shrink(file, max = 560){
  const url = URL.createObjectURL(file), im = new Image();
  try {
    await new Promise((ok, ko) => { im.onload = ok; im.onerror = ko; im.src = url; });
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    let q = 0.8, src = c.toDataURL('image/jpeg', q);
    while (src.length > 300000 && q > 0.4) { q -= 0.12; src = c.toDataURL('image/jpeg', q); }
    return src;
  } finally { URL.revokeObjectURL(url); }
}
async function upload(id, file){
  if (!file.type.startsWith('image/')) { toast('Scegli un file immagine'); return; }
  try {
    const src = await shrink(file);
    S.imgs['m'+id] = src; save('immagini/m'+id, {src, nome: B[id].nome}); render();
    toast(S.db ? 'Immagine salvata' : 'Immagine visibile solo in questa pagina');
  } catch (err) { console.error(err); toast('Immagine non leggibile'); }
}
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\.[a-z0-9]{2,5}$/,'').replace(/[^a-z0-9]+/g,' ').trim();
const NAMES = B.flatMap(b => [[norm(b.nome), b.id], [norm(b.en), b.id]]).sort((a, c) => c[0].length - a[0].length);
function guess(fn){
  const n = norm(fn.split('/').pop()), ex = NAMES.find(([k]) => k === n);
  if (ex) return ex[1];
  const sg = SUGG.find(s => { const k = norm(s.file); return n === k || n.includes(k); });
  if (sg) return sg.id;
  const c = NAMES.find(([k]) => k.length > 3 && (' ' + n + ' ').includes(' ' + k + ' '));
  return c ? c[1] : null;
}
const IMG_EXT = /\.(jpe?g|png|webp|gif|bmp)$/i;
let zipLib = null;
function loadZipLib(){
  return zipLib || (zipLib = new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload = () => ok(window.JSZip); s.onerror = ko; document.head.appendChild(s); }));
}
function bulkMsg(m){ const el = $('#bulkst'); if (el) el.textContent = m; }
async function bulkAdd(list){
  let files = [];
  for (const f of list) {
    if (/\.zip$/i.test(f.name)) {
      try {
        bulkMsg('Apro ' + f.name + '…');
        const Z = await loadZipLib(), z = await Z.loadAsync(f);
        for (const e of Object.values(z.files)) if (!e.dir && IMG_EXT.test(e.name) && !e.name.includes('__MACOSX')) {
          const blob = await e.async('blob'), ext = e.name.split('.').pop().toLowerCase();
          files.push(new File([blob], e.name.split('/').pop(), {type: 'image/' + (ext === 'jpg' ? 'jpeg' : ext)}));
        }
      } catch (err) { console.error(err); toast('Non riesco ad aprire ' + f.name); }
    } else if (f.type.startsWith('image/') || IMG_EXT.test(f.name)) files.push(f);
  }
  if (!files.length) { bulkMsg('Nessuna immagine trovata.'); return; }
  S.bulk = S.bulk || [];
  for (let i = 0; i < files.length; i++) {
    bulkMsg(`Preparo ${i+1} di ${files.length}…`);
    try { S.bulk.push({name: files[i].name, src: await shrink(files[i]), id: guess(files[i].name)}); } catch (err) { console.error(err); }
  }
  render();
}
async function bulkSave(){
  const todo = (S.bulk || []).filter(x => x.id != null);
  if (!todo.length) return;
  S.saving = true;
  for (let i = 0; i < todo.length; i++) {
    const x = todo[i];
    bulkMsg(`Salvo ${i+1} di ${todo.length}…`);
    S.imgs['m' + x.id] = x.src;
    if (S.db && S.canWrite) {
      try { await S.db.doc('immagini/m' + x.id).set({src: x.src, nome: B[x.id].nome}); x.done = true; }
      catch (err) { console.error(err); x.err = true; if (err && err.code === 'invalid_argument') { S.canWrite = false; break; } }
    } else x.done = true;
  }
  const ok = todo.filter(x => x.done).length, ko = todo.filter(x => x.err).length;
  S.bulk = S.bulk.filter(x => !x.done); S.saving = false; render();
  toast(ko ? `${ok} salvate, ${ko} non riuscite` : `${ok} immagini salvate`);
}
function loadImg(id){
  const k = 'm' + id;
  if (!S.db || k in S.imgs) return;
  S.imgs[k] = null;
  S.db.doc('immagini/' + k).get().then(s => { const x = s.exists ? s.data() : null; S.imgs[k] = x && typeof x.src === 'string' && x.src.startsWith('data:image/') ? x.src : ''; if (S.view === 'mostro' && S.mid === id) render(); }).catch(e => { console.error(e); S.imgs[k] = ''; });
}
document.addEventListener('dragover', e => { const p = e.target.closest && e.target.closest('#pic'); if (p && S.canWrite) { e.preventDefault(); p.classList.add('drop'); } });
document.addEventListener('dragleave', e => { const p = e.target.closest && e.target.closest('#pic'); if (p) p.classList.remove('drop'); });
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('#bulkdrop'); if (z) { e.preventDefault(); z.classList.add('drop'); } });
document.addEventListener('drop', e => { const z = e.target.closest && e.target.closest('#bulkdrop'); if (z) { e.preventDefault(); z.classList.remove('drop'); if (ED()) bulkAdd([...e.dataTransfer.files]); } });
document.addEventListener('drop', e => { const p = e.target.closest && e.target.closest('#pic'); if (!p || !S.canWrite) return; e.preventDefault(); p.classList.remove('drop'); const f = e.dataTransfer.files[0]; if (f && ED()) upload(Number(p.dataset.id), f); });
$('#veil').addEventListener('click', e => { if (e.target.id === 'veil') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#veil').hidden) closeSheet(); });
route();
fetch('mostri35.json', {cache: 'no-cache'}).then(r => r.json()).then(d => { ST = d; render(); }).catch(e => { console.error(e); toast('Schede non caricate'); });
(async () => {
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db) return;
    S.db = db; S.canWrite = !!(user && (user.isOwner() || user.canEdit()));
    db.doc('stato/gruppo').onSnapshot(s => { if (s.exists && s.data().eroi && !s.metadata.hasPendingWrites) { S.eroi = JSON.parse(JSON.stringify(s.data().eroi)); render(); } }, e => console.error(e));
    if (S.view === 'mostro') loadImg(S.mid);
    db.collection('schede').onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.schede = o; render(); }, e => console.error(e));
    db.collection('incontri').onSnapshot(s => { const o = {}; for (const d of s.docs) o[d.id] = d.data(); S.saved = o; render(); }, e => console.error(e));
  } catch(e) { console.error(e); }
})();
}
